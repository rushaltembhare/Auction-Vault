<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuctionVault — Premium Antique Auctions</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050505;--surface:#0d0d0d;--surface2:#141414;
  --accent:#10b981;--accent2:#06d6a0;--accent3:#059669;
  --text:#EBEBEB;--muted:rgba(235,235,235,0.5);--muted2:rgba(235,235,235,0.25);
  --glass:rgba(255,255,255,0.02);--glass2:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --danger:#ef4444;--warn:#f59e0b;--info:#3b82f6;
  --pay-upi:#5f259f;--pay-nb:#1a56db;--pay-card:#0f4c75;--pay-rp:#2d81f7;--pay-pp:#003087;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.serif{font-family:'Newsreader',serif}
.mono,.label{font-family:'Space Grotesk',sans-serif}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#050505}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
@keyframes neon-pulse{0%,100%{opacity:1}50%{opacity:0.6}}
@keyframes shimmer{0%{transform:translateX(-100%) rotate(-45deg)}100%{transform:translateX(200%) rotate(-45deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes countBlink{0%,100%{color:var(--accent)}50%{color:#f59e0b}}
@keyframes bidFlash{0%{background:rgba(16,185,129,0.3)}100%{background:transparent}}
@keyframes morphBlob{0%,100%{border-radius:40% 60% 60% 40%/70% 30% 70% 30%}50%{border-radius:60% 40% 40% 60%/30% 70% 30% 70%}}
@keyframes onlinePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:0.7}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes otpPulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.4)}50%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%{transform:rotate(-15deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
@keyframes payProcessing{0%{width:0%}100%{width:100%}}
@keyframes successPop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(120px) rotate(720deg);opacity:0}}
@keyframes scanLine{0%{top:0%}100%{top:100%}}
@keyframes chartPulse{0%,100%{opacity:1}50%{opacity:0.7}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:border-color 0.3s,transform 0.3s}
.card:hover{border-color:rgba(16,185,129,0.4);transform:translateY(-4px)}
.card-shimmer{position:relative;overflow:hidden}
.card-shimmer::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(16,185,129,0.05) 50%,transparent 100%);transform:translateX(-100%);transition:none;pointer-events:none;}
.card-shimmer:hover::after{animation:shimmer 0.8s ease-out}
input,textarea,select{background:rgba(255,255,255,0.03);border:1px solid var(--border2);color:var(--text);border-radius:10px;padding:12px 16px;width:100%;font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,0.1)}
input::placeholder,textarea::placeholder{color:var(--muted2)}
select option{background:#0d0d0d}
.btn{padding:12px 24px;border-radius:12px;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-warn{background:var(--warn);color:#000}
.btn-sm{padding:8px 16px;font-size:11px;border-radius:8px}
.btn-pill{border-radius:9999px}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;font-family:'Space Grotesk',sans-serif;letter-spacing:0.1em;text-transform:uppercase}
.badge-live{background:rgba(16,185,129,0.15);color:var(--accent);border:1px solid rgba(16,185,129,0.3)}
.badge-pending{background:rgba(245,158,11,0.15);color:var(--warn);border:1px solid rgba(245,158,11,0.3)}
.badge-sold{background:rgba(59,130,246,0.15);color:var(--info);border:1px solid rgba(59,130,246,0.3)}
.badge-rejected{background:rgba(239,68,68,0.15);color:var(--danger);border:1px solid rgba(239,68,68,0.3)}
.badge-approved{background:rgba(16,185,129,0.1);color:var(--accent)}
.badge-verified{background:rgba(16,185,129,0.15);color:var(--accent);border:1px solid rgba(16,185,129,0.3)}
.badge-soon{background:rgba(139,92,246,0.15);color:#a78bfa;border:1px solid rgba(139,92,246,0.3)}
.dot-pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:neon-pulse 1.5s infinite}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(5,5,5,0.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Newsreader',serif;font-size:22px;font-style:italic;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:10px}
.nav-logo span{color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeInUp 0.2s ease}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;animation:fadeInUp 0.3s cubic-bezier(0.16,1,0.3,1)}
.bid-flash{animation:bidFlash 0.8s ease}
.countdown{font-family:'Space Grotesk',sans-serif;font-size:11px;animation:countBlink 2s infinite}
.morph-blob{position:fixed;width:400px;height:400px;background:rgba(16,185,129,0.04);filter:blur(80px);animation:morphBlob 10s ease-in-out infinite;pointer-events:none;z-index:0}
.section{padding:80px 32px;max-width:1400px;margin:0 auto}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.toast-container{position:fixed;top:80px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:12px 20px;font-size:13px;display:flex;align-items:center;gap:10px;min-width:280px;animation:slideIn 0.3s cubic-bezier(0.16,1,0.3,1);box-shadow:0 4px 24px rgba(0,0,0,0.4)}
.toast-success{border-left:3px solid var(--accent)}
.toast-error{border-left:3px solid var(--danger)}
.toast-info{border-left:3px solid var(--info)}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:9px;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;background:transparent;color:var(--muted);transition:all 0.2s;flex:1;min-width:80px}
.tab.active{background:var(--accent);color:#000}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:20px}
.stat-value{font-family:'Newsreader',serif;font-size:32px;font-weight:700;color:var(--accent)}
.stat-label{font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
#squares-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.4}
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.upload-zone:hover{border-color:var(--accent);background:rgba(16,185,129,0.04)}
.upload-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:12px}
.upload-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.upload-thumb img{width:100%;height:100%;object-fit:cover}
.upload-thumb-del{position:absolute;top:2px;right:2px;background:rgba(239,68,68,0.9);border:none;color:#fff;border-radius:4px;width:18px;height:18px;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.online-dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:onlinePulse 2s infinite;display:inline-block}
.offline-dot{width:8px;height:8px;border-radius:50%;background:#6b7280;display:inline-block}
.otp-inputs{display:flex;gap:10px;justify-content:center;margin:20px 0}
.otp-input{width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;font-family:'Space Grotesk',sans-serif;border-radius:12px;border:2px solid var(--border2);background:rgba(255,255,255,0.04);color:var(--text);outline:none;transition:all 0.2s}
.otp-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,0.15);animation:otpPulse 1s infinite}
.otp-input.filled{border-color:var(--accent);background:rgba(16,185,129,0.08)}
.captcha-wrapper{background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:16px;margin:16px 0}
.captcha-verify-btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.captcha-verify-btn:hover{border-color:var(--accent);color:var(--accent)}
.captcha-verify-btn.verified{background:rgba(16,185,129,0.1);border-color:var(--accent);color:var(--accent)}
.doc-zone{border:2px dashed var(--border2);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:12px}
.doc-zone:hover,.doc-zone.drag{border-color:var(--accent);background:rgba(16,185,129,0.04)}
.doc-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
.doc-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.doc-icon.pdf{background:rgba(239,68,68,0.15);color:var(--danger)}
.doc-icon.img{background:rgba(59,130,246,0.15);color:var(--info)}
.doc-preview-modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:400;display:flex;align-items:center;justify-content:center;padding:12px}
.doc-preview-inner{background:var(--surface);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:820px;max-height:96vh;overflow:hidden;display:flex;flex-direction:column}
.scan-overlay{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:8px}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scanLine 1.8s linear infinite;box-shadow:0 0 8px var(--accent)}
.scan-corner{position:absolute;width:20px;height:20px;border-color:var(--accent);border-style:solid}
.scan-corner.tl{top:8px;left:8px;border-width:3px 0 0 3px}
.scan-corner.tr{top:8px;right:8px;border-width:3px 3px 0 0}
.scan-corner.bl{bottom:8px;left:8px;border-width:0 0 3px 3px}
.scan-corner.br{bottom:8px;right:8px;border-width:0 3px 3px 0}
.phone-row{display:flex;gap:8px}
.phone-prefix{background:rgba(255,255,255,0.06);border:1px solid var(--border2);color:var(--muted);border-radius:10px;padding:12px 14px;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0}
.step-indicator{display:flex;align-items:center;gap:0;margin-bottom:28px}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;flex-shrink:0;transition:all 0.3s}
.step-dot.done{background:var(--accent);color:#000}
.step-dot.active{background:rgba(16,185,129,0.2);border:2px solid var(--accent);color:var(--accent)}
.step-dot.todo{background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.step-line{flex:1;height:1px;background:var(--border)}
.step-line.done{background:var(--accent)}
.verify-badge{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em}
.verify-badge.pending{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--warn)}
.verify-badge.verified{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--accent)}
.verify-badge.rejected{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--danger)}
.otp-demo-box{background:rgba(16,185,129,0.08);border:2px solid var(--accent);border-radius:14px;padding:16px 20px;margin:12px 0;text-align:center}
.otp-demo-code{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;color:var(--accent);letter-spacing:8px;margin:8px 0}
.notif-bell{position:relative;cursor:pointer;background:none;border:none;color:var(--text);font-size:20px;padding:4px 8px;border-radius:8px;transition:background 0.2s}
.notif-bell:hover{background:var(--surface2)}
.notif-badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.notif-bell.ringing{animation:bellRing 0.6s ease}
.notif-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:320px;background:var(--surface);border:1px solid var(--border2);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,0.6);z-index:200;overflow:hidden;animation:fadeInUp 0.2s ease}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:background 0.15s}
.notif-item:hover{background:var(--surface2)}
.notif-item.unread{border-left:3px solid var(--accent)}
.pay-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeInUp 0.25s ease}
.pay-modal{background:var(--surface);border:1px solid var(--border2);border-radius:24px;width:100%;max-width:600px;max-height:95vh;overflow-y:auto;animation:fadeInUp 0.3s cubic-bezier(0.16,1,0.3,1)}
.pay-method-card{border:2px solid var(--border);border-radius:14px;padding:16px 20px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:14px;margin-bottom:10px;background:rgba(255,255,255,0.01)}
.pay-method-card:hover{border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.04);transform:translateX(4px)}
.pay-method-card.selected{border-color:var(--accent);background:rgba(16,185,129,0.06)}
.pay-method-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.pay-method-icon.upi{background:linear-gradient(135deg,rgba(95,37,159,0.25),rgba(95,37,159,0.1));border:1px solid rgba(95,37,159,0.4)}
.pay-method-icon.nb{background:linear-gradient(135deg,rgba(26,86,219,0.25),rgba(26,86,219,0.1));border:1px solid rgba(26,86,219,0.4)}
.pay-method-icon.card{background:linear-gradient(135deg,rgba(15,76,117,0.25),rgba(15,76,117,0.1));border:1px solid rgba(15,76,117,0.4)}
.pay-method-icon.rp{background:linear-gradient(135deg,rgba(45,129,247,0.25),rgba(45,129,247,0.1));border:1px solid rgba(45,129,247,0.4)}
.pay-method-icon.pp{background:linear-gradient(135deg,rgba(0,48,135,0.25),rgba(0,48,135,0.1));border:1px solid rgba(0,48,135,0.4)}
.pay-step-header{padding:22px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}
.pay-step-body{padding:24px 28px}
.pay-summary-box{background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.pay-input-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay-input-label{font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.pay-processing-bar{height:4px;background:rgba(16,185,129,0.15);border-radius:4px;overflow:hidden;margin:16px 0}
.pay-processing-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;animation:payProcessing 2.5s ease-in-out forwards}
.pay-success-icon{width:80px;height:80px;border-radius:50%;background:rgba(16,185,129,0.15);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px;animation:successPop 0.6s cubic-bezier(0.16,1,0.3,1)}
.upi-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.upi-app-btn{border:1px solid var(--border2);border-radius:12px;padding:12px 8px;cursor:pointer;text-align:center;transition:all 0.2s;background:rgba(255,255,255,0.02)}
.upi-app-btn:hover{border-color:var(--accent);background:rgba(16,185,129,0.06)}
.upi-app-btn.selected{border-color:var(--accent);background:rgba(16,185,129,0.1)}
.upi-app-btn .app-icon{font-size:26px;margin-bottom:6px}
.upi-app-btn .app-name{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;color:var(--muted)}
.bank-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;max-height:200px;overflow-y:auto}
.bank-btn{border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;transition:all 0.2s;background:rgba(255,255,255,0.02);display:flex;align-items:center;gap:8px;font-size:12px}
.bank-btn:hover{border-color:var(--accent)}
.bank-btn.selected{border-color:var(--accent);background:rgba(16,185,129,0.06)}
.card-input-group{position:relative}
.card-chip{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:4px;align-items:center}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall 1.2s ease-out forwards}
.receipt-section{border-top:1px dashed rgba(255,255,255,0.1);padding-top:14px;margin-top:14px}
.receipt-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.receipt-row.total{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--accent);font-size:15px;padding-top:8px;border-top:1px solid var(--border)}
.address-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

const TAX_RATE = 0.18;
const PLATFORM_FEE_RATE = 0.02;
const SHIPPING_CHARGE = 499;

const PaymentSystem = {
  generateOrderId() { return 'AV' + Date.now() + Math.floor(Math.random()*1000); },
  generateTxnId() { return 'TXN' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*9999).toString().padStart(4,'0'); },
  calculateBreakdown(bidAmount) {
    const platformFee = Math.round(bidAmount * PLATFORM_FEE_RATE);
    const subtotal = bidAmount + platformFee + SHIPPING_CHARGE;
    const gst = Math.round(subtotal * TAX_RATE);
    const total = subtotal + gst;
    return { bidAmount, platformFee, shippingCharge:SHIPPING_CHARGE, subtotal, gst, total };
  },
  savePayment(paymentData) {
    const payments = DB.get('payments', []);
    payments.push(paymentData);
    DB.set('payments', payments);
    const prods = DB.get('products', []);
    const pi = prods.findIndex(p => p.id === paymentData.productId);
    if(pi >= 0) { prods[pi].status = 'sold'; prods[pi].paidBy = paymentData.userEmail; prods[pi].paymentId = paymentData.orderId; }
    DB.set('products', prods);
    return paymentData;
  },
  getMyPayments(email) { return DB.get('payments', []).filter(p => p.userEmail === email); }
};

const OTPSystem = {
  generate() { return String(Math.floor(100000 + Math.random()*900000)); },
  send(phone, otp) {
    const store = DB.get('otp_store', []);
    const filtered = store.filter(o => o.phone !== phone);
    filtered.push({ phone, otp, expiry: Date.now()+120000, used:false, attempts:0, createdAt:Date.now() });
    DB.set('otp_store', filtered);
    return otp;
  },
  getLatestOTP(phone) {
    const store = DB.get('otp_store', []);
    const entries = store.filter(o=>o.phone===phone&&!o.used).sort((a,b)=>b.createdAt-a.createdAt);
    if(!entries.length) return null;
    const entry = entries[0];
    if(Date.now()>entry.expiry) return null;
    return entry.otp;
  },
  verify(phone, inputOtp) {
    const store = DB.get('otp_store', []);
    const entries = store.filter(o=>o.phone===phone&&!o.used).sort((a,b)=>b.createdAt-a.createdAt);
    if(!entries.length) return {ok:false,reason:'No OTP found. Please request again.'};
    const entry = entries[0];
    if(Date.now()>entry.expiry) return {ok:false,reason:'OTP expired. Please request a new one.'};
    if(entry.attempts>=5) return {ok:false,reason:'Too many attempts. Please request a new OTP.'};
    entry.attempts++;
    if(entry.otp!==inputOtp.trim()){DB.set('otp_store',store);return {ok:false,reason:'Incorrect OTP. '+String(5-entry.attempts)+' attempts left.'};}
    entry.used=true; DB.set('otp_store',store); return {ok:true};
  },
  canResend(phone) {
    const store = DB.get('otp_store',[]);
    const entries = store.filter(o=>o.phone===phone).sort((a,b)=>b.createdAt-a.createdAt);
    if(!entries.length) return true;
    return Date.now()-entries[0].createdAt>30000;
  }
};

function buildCaptchaGrid(category) {
  const correct=[...category.correctImages].sort(()=>Math.random()-0.5).slice(0,3);
  const decoys=[...category.decoyImages].sort(()=>Math.random()-0.5).slice(0,9);
  const correctSet=new Set(correct);
  const all=[...correct,...decoys].sort(()=>Math.random()-0.5).slice(0,12);
  return {cells:all.map((img,i)=>({img,correct:correctSet.has(img),id:i})),correctUrls:correct};
}

const OnlineTracker = {
  heartbeatInterval:null,
  join(user){
    const list=DB.get('online_users',[]);
    const exists=list.find(u=>u.email===user.email);
    if(!exists) list.push({email:user.email,name:user.name,role:user.role,joinedAt:Date.now(),lastSeen:Date.now()});
    else exists.lastSeen=Date.now();
    DB.set('online_users',list);
    this.heartbeatInterval=setInterval(()=>{const l=DB.get('online_users',[]);const u=l.find(x=>x.email===user.email);if(u){u.lastSeen=Date.now();DB.set('online_users',l);}},5000);
  },
  leave(user){if(this.heartbeatInterval) clearInterval(this.heartbeatInterval);DB.set('online_users',DB.get('online_users',[]).filter(u=>u.email!==user.email));},
  getOnline(){const now=Date.now();return DB.get('online_users',[]).filter(u=>now-u.lastSeen<15000);}
};

const Analytics = {
  getBidActivity(products) {
    const now = Date.now();
    const hours = Array.from({length:12},(_,i)=>({
      label: new Date(now - (11-i)*3600000).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),
      count: 0, value: 0
    }));
    products.forEach(p=>{
      (p.bids||[]).forEach(b=>{
        const hoursAgo = (now - b.time) / 3600000;
        if(hoursAgo <= 12) {
          const idx = Math.min(11, Math.floor(11 - hoursAgo + 1));
          if(hours[idx]) { hours[idx].count++; hours[idx].value += b.amount; }
        }
      });
    });
    return hours;
  },
  getRevenueByCategory(products) {
    const cats = {};
    products.forEach(p=>{
      const cat = p.year < 1900 ? 'Pre-1900s' : p.year < 1950 ? '1900–1950' : p.year < 1980 ? '1950–1980' : 'Post-1980';
      if(!cats[cat]) cats[cat] = {bids:0, value:0, items:0};
      cats[cat].bids += (p.bids||[]).length;
      cats[cat].value += p.currentBid;
      cats[cat].items++;
    });
    return cats;
  },
  getSellerMetrics(sellerEmail, products) {
    const myProds = products.filter(p=>p.sellerId===sellerEmail);
    const allBids = myProds.flatMap(p=>(p.bids||[]).map(b=>({...b,product:p.title,status:p.status})));
    const uniqueBidders = new Set(allBids.map(b=>b.email)).size;
    const avgBid = allBids.length > 0 ? Math.round(allBids.reduce((s,b)=>s+b.amount,0)/allBids.length) : 0;
    const soldItems = myProds.filter(p=>p.status==='sold');
    const convRate = myProds.length > 0 ? Math.round((soldItems.length/myProds.length)*100) : 0;
    return { myProds, allBids, uniqueBidders, avgBid, soldItems, convRate };
  },
  getUserMetrics(userEmail, products) {
    const myBids = [];
    products.forEach(p=>{
      (p.bids||[]).filter(b=>b.email===userEmail).forEach(b=>{
        myBids.push({...b, product:p.title, status:p.status, isHighest:p.currentBid===b.amount});
      });
    });
    const byProduct = {};
    myBids.forEach(b=>{ if(!byProduct[b.product]) byProduct[b.product]={bids:0,highest:0,status:b.status}; byProduct[b.product].bids++; byProduct[b.product].highest=Math.max(byProduct[b.product].highest,b.amount); byProduct[b.product].status=b.status; });
    return { myBids, byProduct };
  }
};

function useChart(canvasRef, config, deps=[]) {
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!canvasRef.current) return;
    if(chartRef.current) { chartRef.current.destroy(); chartRef.current=null; }
    if(window.Chart) {
      chartRef.current = new window.Chart(canvasRef.current, config);
    }
    return ()=>{ if(chartRef.current){chartRef.current.destroy();chartRef.current=null;} };
  }, deps);
}

function SquareGlowBox({children,style={},borderRadius=18}){
  const containerRef=useRef(null);const canvasRef=useRef(null);
  useEffect(()=>{
    const canvas=canvasRef.current;const container=containerRef.current;
    if(!canvas||!container)return;
    const ctx=canvas.getContext('2d');
    let animId,time=0;
    const resize=()=>{const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=container.offsetWidth*dpr;canvas.height=container.offsetHeight*dpr;canvas.style.width=container.offsetWidth+'px';canvas.style.height=container.offsetHeight+'px';ctx.scale(dpr,dpr);};
    resize();const ro=new ResizeObserver(()=>{ctx.setTransform(1,0,0,1,0,0);resize();});ro.observe(container);
    const draw=()=>{
      time+=0.014;const w=container.offsetWidth,h=container.offsetHeight;ctx.clearRect(0,0,w,h);
      const sz=34;const cols=Math.ceil(w/sz)+2;const rows=Math.ceil(h/sz)+2;const ox=(time*18)%sz;const oy=(time*11)%sz;
      for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const x=c*sz-ox,y=r*sz-oy;const cx2=x+sz/2,cy2=y+sz/2;const dx=(cx2-w/2)/w;const dy=(cy2-h/2)/h;const dist=Math.sqrt(dx*dx+dy*dy);const wave=Math.sin(dist*9-time*2.8+c*0.42+r*0.38);const alpha=Math.max(0,(wave*0.5+0.5)*0.28*(1.1-dist*1.05));if(alpha<0.005)continue;ctx.strokeStyle=`rgba(16,185,129,${Math.min(alpha,0.55)})`;ctx.lineWidth=0.8;ctx.strokeRect(x,y,sz,sz);if(wave>0.65){ctx.fillStyle=`rgba(16,185,129,${alpha*0.42})`;ctx.fillRect(x+1,y+1,sz-2,sz-2);}}}
      [[0,0],[w,0],[0,h],[w,h]].forEach(([cx2,cy2],i)=>{const p=Math.sin(time*1.8+i*1.7)*0.5+0.5;const g=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,72);g.addColorStop(0,`rgba(16,185,129,${0.22*p})`);g.addColorStop(1,'rgba(16,185,129,0)');ctx.fillStyle=g;ctx.fillRect(cx2-72,cy2-72,144,144);});
      animId=requestAnimationFrame(draw);
    };
    draw();
    return()=>{cancelAnimationFrame(animId);ro.disconnect();};
  },[]);
  return(
    <div ref={containerRef} style={{position:'relative',borderRadius,...style}}>
      <canvas ref={canvasRef} style={{position:'absolute',inset:0,borderRadius,pointerEvents:'none',zIndex:0}}/>
      <div style={{position:'absolute',inset:0,borderRadius,border:'1px solid rgba(16,185,129,0.25)',pointerEvents:'none',zIndex:0,boxShadow:'0 0 40px rgba(16,185,129,0.07) inset,0 0 80px rgba(16,185,129,0.04)'}}/>

    </div>
  );
}

function ElectricCard({children,style={}}){
  const containerRef=useRef(null);const canvasRef=useRef(null);
  useEffect(()=>{
    const canvas=canvasRef.current;const container=containerRef.current;
    if(!canvas||!container)return;
    const ctx=canvas.getContext('2d');
    let animId,time=Math.random()*100,hov=false;
    const resize=()=>{const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=container.offsetWidth*dpr;canvas.height=container.offsetHeight*dpr;canvas.style.width=container.offsetWidth+'px';canvas.style.height=container.offsetHeight+'px';ctx.scale(dpr,dpr);};
    resize();const ro=new ResizeObserver(()=>{ctx.setTransform(1,0,0,1,0,0);resize();});ro.observe(container);
    const onEnter=()=>{hov=true;};const onLeave=()=>{hov=false;};
    container.addEventListener('mouseenter',onEnter);container.addEventListener('mouseleave',onLeave);
    const draw=()=>{
      time+=hov?0.026:0.008;const w=container.offsetWidth,h=container.offsetHeight;ctx.clearRect(0,0,w,h);
      const sz=26;const cols=Math.ceil(w/sz)+2;const rows=Math.ceil(h/sz)+2;const ox=(time*15)%sz;const oy=(time*9)%sz;const boost=hov?2.4:1.0;
      for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const x=c*sz-ox,y=r*sz-oy;const cx2=x+sz/2,cy2=y+sz/2;const dx=(cx2-w/2)/w;const dy=(cy2-h/2)/h;const dist=Math.sqrt(dx*dx+dy*dy);const wave=Math.sin(dist*11-time*2.6+c*0.5+r*0.44);const alpha=Math.max(0,(wave*0.5+0.5)*0.21*(1.15-dist)*boost);if(alpha<0.005)continue;ctx.strokeStyle=`rgba(16,185,129,${Math.min(alpha,0.6)})`;ctx.lineWidth=0.65;ctx.strokeRect(x,y,sz,sz);if(wave>0.68&&hov){ctx.fillStyle=`rgba(16,185,129,${alpha*0.4})`;ctx.fillRect(x+1,y+1,sz-2,sz-2);}}}
      if(hov){const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.65);g.addColorStop(0,'rgba(16,185,129,0.07)');g.addColorStop(1,'rgba(16,185,129,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}
      animId=requestAnimationFrame(draw);
    };
    draw();
    return()=>{cancelAnimationFrame(animId);ro.disconnect();container.removeEventListener('mouseenter',onEnter);container.removeEventListener('mouseleave',onLeave);};
  },[]);
  return(
    <div ref={containerRef} className="card card-shimmer" style={{borderRadius:16,cursor:'pointer',position:'relative',...style}}>
      <canvas ref={canvasRef} style={{position:'absolute',inset:0,borderRadius:16,pointerEvents:'none',zIndex:0}}/>
      <div style={{position:'absolute',inset:0,borderRadius:16,border:'1px solid rgba(16,185,129,0.2)',pointerEvents:'none',zIndex:0}}/>
      <div style={{position:'relative',borderRadius:14,background:'var(--surface)',zIndex:1,overflow:'hidden'}}>{children}</div>
    </div>
  );
}

function initSquares(){
  const canvas=document.getElementById('squares-canvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');const sz=40;let ox=0,oy=0,hover={x:-1,y:-1};
  const resize=()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight};
  resize();window.addEventListener('resize',resize);
  window.addEventListener('mousemove',e=>{hover={x:Math.floor((e.clientX+(ox%sz))/sz),y:Math.floor((e.clientY+(oy%sz))/sz)}});
  const draw=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);const sx=Math.floor(ox/sz)*sz,sy=Math.floor(oy/sz)*sz;ctx.lineWidth=0.5;for(let x=sx;x<canvas.width+sz;x+=sz){for(let y=sy;y<canvas.height+sz;y+=sz){const qx=x-(ox%sz),qy=y-(oy%sz);const gx=Math.floor((x-sx)/sz),gy=Math.floor((y-sy)/sz);if(hover.x===gx&&hover.y===gy){ctx.fillStyle='rgba(16,185,129,0.08)';ctx.fillRect(qx,qy,sz,sz)}ctx.strokeStyle='rgba(16,185,129,0.12)';ctx.strokeRect(qx,qy,sz,sz);}}const g=ctx.createRadialGradient(canvas.width/2,canvas.height/2,0,canvas.width/2,canvas.height/2,Math.max(canvas.width,canvas.height)/1.5);g.addColorStop(0,'rgba(5,5,5,0)');g.addColorStop(1,'rgba(5,5,5,0.85)');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ox=(ox-0.3+sz)%sz;oy=(oy-0.3+sz)%sz;requestAnimationFrame(draw);};
  draw();
}

function CountdownTimer({endTime}){
  const [left,setLeft]=useState(endTime?Math.max(0,endTime-Date.now()):0);
  useEffect(()=>{if(!endTime)return;const i=setInterval(()=>setLeft(Math.max(0,endTime-Date.now())),1000);return()=>clearInterval(i);},[endTime]);
  if(!endTime) return null;
  if(left<=0)return <span className="badge badge-sold">Ended</span>;
  const h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000),s=Math.floor((left%60000)/1000);

function OTPInput({length=6,value,onChange}){
  const inputs=useRef([]);
  const vals=value?value.split(''):Array(length).fill('');
  while(vals.length<length) vals.push('');
  const handleChange=(i,v)=>{const newVals=[...vals];newVals[i]=v.replace(/\D/g,'').slice(-1);onChange(newVals.join(''));if(v&&i<length-1)inputs.current[i+1]?.focus();};
  const handleKeyDown=(i,e)=>{if(e.key==='Backspace'&&!vals[i]&&i>0)inputs.current[i-1]?.focus();};
  const handlePaste=(e)=>{const pasted=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,length);if(pasted.length>0){onChange(pasted.padEnd(length,'').slice(0,length));inputs.current[Math.min(pasted.length,length-1)]?.focus();}e.preventDefault();};
  return(
    <div className="otp-inputs">
      {Array(length).fill(0).map((_,i)=>(
        <input key={i} ref={el=>inputs.current[i]=el} className={`otp-input${vals[i]?' filled':''}`} type="text" inputMode="numeric" maxLength={1} value={vals[i]} onChange={e=>handleChange(i,e.target.value)} onKeyDown={e=>handleKeyDown(i,e)} onPaste={handlePaste}/>
      ))}
    </div>
  );
}

    { id:'netbanking', label:'Net Banking', sub:'All major Indian banks supported', icon:'🏦', cls:'nb' },
    { id:'card', label:'Credit / Debit Card', sub:'Visa, Mastercard, RuPay, Amex', icon:'💳', cls:'card' },
    { id:'razorpay', label:'Razorpay', sub:'Smart checkout with saved cards & EMI', icon:'⚡', cls:'rp' },
    { id:'paypal', label:'PayPal', sub:'International payments accepted', icon:'🌐', cls:'pp' },
  ];

  const UPI_APPS = [
    { id:'phonepe', name:'PhonePe', icon:'💜' },
    { id:'gpay', name:'Google Pay', icon:'🟢' },
    { id:'paytm', name:'Paytm', icon:'💙' },
    { id:'bhim', name:'BHIM', icon:'🇮🇳' },
  ];

  const BANKS = ['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank','Kotak Mahindra','Punjab National Bank','Bank of Baroda','Canara Bank','Union Bank of India','Yes Bank','IDFC First Bank','IndusInd Bank'];

  const validateAddress = () => {
    if (!address.name.trim()) return 'Full name is required';
    if (!address.phone || address.phone.length < 10) return 'Valid 10-digit phone required';
    if (!address.line1.trim()) return 'Address line 1 is required';
    if (!address.city.trim()) return 'City is required';
    if (!address.state.trim()) return 'State is required';
    if (!address.pincode || address.pincode.length !== 6) return 'Valid 6-digit pincode required';
    return '';
  };

  const handleAddressNext = () => { const err = validateAddress(); if (err) { setAddrErr(err); return; } setAddrErr(''); setStep(2); };
  const handleMethodNext = () => { if (!selectedMethod) { addToast('Please select a payment method', 'error'); return; } setStep(3); };
  const handleFormatCard = (val) => { const cleaned = val.replace(/\D/g, '').slice(0, 16); return cleaned.replace(/(.{4})/g, '$1 ').trim(); };
  const handleFormatExpiry = (val) => { const cleaned = val.replace(/\D/g, '').slice(0, 4); if (cleaned.length > 2) return cleaned.slice(0,2) + '/' + cleaned.slice(2); return cleaned; };

  const validatePaymentDetails = () => {
    if (selectedMethod === 'upi') { if (selectedUPIApp) return true; if (!upiId || !upiId.includes('@')) { addToast('Enter valid UPI ID', 'error'); return false; } return true; }
    if (selectedMethod === 'netbanking') { if (!selectedBank) { addToast('Please select a bank', 'error'); return false; } return true; }
    if (selectedMethod === 'card') { const num = cardData.number.replace(/\s/g,''); if (num.length < 16) { addToast('Enter valid 16-digit card number', 'error'); return false; } if (!cardData.name.trim()) { addToast('Enter cardholder name', 'error'); return false; } if (!cardData.expiry||!cardData.expiry.includes('/')) { addToast('Enter valid expiry', 'error'); return false; } if (!cardData.cvv||cardData.cvv.length < 3) { addToast('Enter valid CVV', 'error'); return false; } return true; }
    if (selectedMethod === 'razorpay' || selectedMethod === 'paypal') return true;
    return false;
  };

  const processPayment = () => {
    if (!validatePaymentDetails()) return;
    setStep(4);
    setTimeout(() => {
      const orderId = PaymentSystem.generateOrderId();
      const txnId = PaymentSystem.generateTxnId();
      const methodLabels = { upi:'UPI Payment', netbanking:'Net Banking', card:'Card Payment', razorpay:'Razorpay', paypal:'PayPal' };
      const pd = { orderId, txnId, userEmail: user.email, userName: user.name, productId: product.id, productTitle: product.title, productYear: product.year, sellerName: product.sellerName, method: selectedMethod, methodLabel: selectedMethod==='upi'&&selectedUPIApp ? UPI_APPS.find(a=>a.id===selectedUPIApp)?.name+' (UPI)' : selectedMethod==='netbanking'&&selectedBank ? selectedBank+' (Net Banking)' : methodLabels[selectedMethod]||selectedMethod, breakdown, address: { ...address }, timestamp: Date.now(), status: 'paid' };
      PaymentSystem.savePayment(pd);
      setPaymentData(pd);
      setConfetti(Array.from({length:18}, (_,i) => ({ id:i, color:['#10b981','#06d6a0','#f59e0b','#3b82f6','#fff'][i%5], left: 10 + Math.random()*80, delay: Math.random()*0.8, size:6+Math.random()*6 })));
      setStep(5);
      onSuccess(pd);
      const notifs = DB.get('notifications', []);
      notifs.push({ id:'n'+Date.now(), type:'payment', message:`Payment of ₹${breakdown.total.toLocaleString('en-IN')} received from ${user.name} for "${product.title}"`, time:Date.now(), read:false });
      DB.set('notifications', notifs);
    }, 2800);
  };

  const downloadReceipt = () => { if (!paymentData) return; try { ReceiptPDF.generate(paymentData); addToast('Receipt downloaded!', 'success'); } catch(e) { addToast('Error generating receipt', 'error'); } };
  const imgSrc = Array.isArray(product.images) && product.images.length > 0 ? product.images[0] : product.image;
  const stepTitles = ['Order Summary', 'Delivery Address', 'Payment Method', 'Payment Details', 'Processing Payment', 'Payment Successful'];

  return (
    <div className="pay-overlay" onClick={e=>e.target===e.currentTarget&&step!==4&&step!==5&&onClose()}>
      <div className="pay-modal">
        <div className="pay-step-header">
          {step < 5 && step !== 4 && (<button onClick={step===0?onClose:()=>setStep(s=>Math.max(0,s-1))} style={{background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:8,width:32,height:32,cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{step===0?'×':'←'}</button>)}
          <div style={{flex:1}}><h3 style={{fontFamily:'Newsreader',fontSize:20,marginBottom:2}}>{stepTitles[step]}</h3>{step < 5 && <div style={{display:'flex',gap:4,marginTop:6}}>{[0,1,2,3].map(i=><div key={i} style={{height:3,flex:1,borderRadius:3,background:i<=step-1?'var(--accent)':i===step?'rgba(16,185,129,0.4)':'rgba(255,255,255,0.08)',transition:'background 0.3s'}}/>)}</div>}</div>
          {step === 5 && <button onClick={onClose} style={{background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:8,width:32,height:32,cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center',marginLeft:'auto'}}>×</button>}
        </div>
        {step === 0 && (
          <div className="pay-step-body">
            <div className="pay-summary-box">
              <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
                <img src={imgSrc} alt={product.title} style={{width:80,height:64,borderRadius:10,objectFit:'cover',flexShrink:0}} onError={e=>{e.target.onerror=null;e.target.src='https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Antique-books-woodward.jpg/960px-Antique-books-woodward.jpg'}}/>
                <div style={{flex:1}}><div style={{fontWeight:600,fontSize:15,marginBottom:3,lineHeight:1.3}}>{product.title}</div><div style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk',marginBottom:8}}>{product.sellerName} • Est. {product.year}</div><span className="badge badge-live" style={{fontSize:9}}>🏆 Auction Won</span></div>
              </div>
            </div>
            <div style={{background:'var(--surface2)',borderRadius:14,padding:'18px 20px',marginBottom:20}}>
              {[{l:'Winning Bid Amount',v:breakdown.bidAmount},{l:'Platform Fee (2%)',v:breakdown.platformFee,muted:true},{l:'Shipping & Handling',v:breakdown.shippingCharge,muted:true}].map((r,i)=>(<div key={i} className="receipt-row" style={{color:r.muted?'var(--muted)':'var(--text)'}}><span>{r.l}</span><span style={{fontFamily:'Space Grotesk',fontWeight:r.muted?400:600}}>₹{r.v.toLocaleString('en-IN')}</span></div>))}
              <div className="receipt-row" style={{color:'var(--muted)'}}><span>Subtotal</span><span style={{fontFamily:'Space Grotesk'}}>₹{breakdown.subtotal.toLocaleString('en-IN')}</span></div>
              <div className="receipt-row" style={{color:'var(--muted)'}}><span>GST (18%)</span><span style={{fontFamily:'Space Grotesk'}}>₹{breakdown.gst.toLocaleString('en-IN')}</span></div>
              <div className="receipt-row total"><span>Total Payable</span><span>₹{breakdown.total.toLocaleString('en-IN')}</span></div>
            </div>
            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',boxShadow:'0 0 16px rgba(16,185,129,0.4)',fontSize:14,padding:'14px'}} onClick={()=>setStep(1)}>Proceed to Delivery Address →</button>
          </div>
        )}
        {step === 1 && (
          <div className="pay-step-body">
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <div><label className="pay-input-label">Full Name *</label><input value={address.name} onChange={e=>setAddress(a=>({...a,name:e.target.value}))} placeholder="As per ID proof"/></div>
              <div><label className="pay-input-label">Mobile Number *</label><div className="phone-row"><div className="phone-prefix">+91</div><input type="tel" value={address.phone} onChange={e=>setAddress(a=>({...a,phone:e.target.value.replace(/\D/g,'').slice(0,10)}))} placeholder="10-digit mobile"/></div></div>
              <div><label className="pay-input-label">Address Line 1 *</label><input value={address.line1} onChange={e=>setAddress(a=>({...a,line1:e.target.value}))} placeholder="House/Flat No., Building, Street"/></div>
              <div><label className="pay-input-label">Address Line 2</label><input value={address.line2} onChange={e=>setAddress(a=>({...a,line2:e.target.value}))} placeholder="Area, Landmark (optional)"/></div>
              <div className="address-grid">
                <div><label className="pay-input-label">City *</label><input value={address.city} onChange={e=>setAddress(a=>({...a,city:e.target.value}))} placeholder="Mumbai"/></div>
                <div><label className="pay-input-label">State *</label>
                  <select value={address.state} onChange={e=>setAddress(a=>({...a,state:e.target.value}))}>
                    <option value="">Select State</option>
                    {['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Delhi','Jammu & Kashmir','Ladakh','Puducherry'].map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div className="address-grid">
                <div><label className="pay-input-label">Pincode *</label><input type="tel" value={address.pincode} onChange={e=>setAddress(a=>({...a,pincode:e.target.value.replace(/\D/g,'').slice(0,6)}))} placeholder="400001" maxLength={6}/></div>
                <div><label className="pay-input-label">GSTIN (Optional)</label><input value={address.gst} onChange={e=>setAddress(a=>({...a,gst:e.target.value.toUpperCase()}))} placeholder="For business billing"/></div>
              </div>
            </div>
            {addrErr && <div style={{color:'var(--danger)',fontSize:12,marginTop:10}}>{addrErr}</div>}
            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:20,boxShadow:'0 0 16px rgba(16,185,129,0.4)',fontSize:14,padding:'14px'}} onClick={handleAddressNext}>Continue to Payment →</button>
          </div>
        )}
        {step === 2 && (
          <div className="pay-step-body">
            <div style={{marginBottom:16,fontSize:12,color:'var(--muted)'}}>Amount Payable: <strong style={{color:'var(--accent)',fontFamily:'Space Grotesk',fontSize:16}}>₹{breakdown.total.toLocaleString('en-IN')}</strong></div>
            {METHODS.map(m => (
              <div key={m.id} className={`pay-method-card${selectedMethod===m.id?' selected':''}`} onClick={()=>setSelectedMethod(m.id)}>
                <div className={`pay-method-icon ${m.cls}`}>{m.icon}</div>
                <div style={{flex:1}}><div style={{display:'flex',alignItems:'center',gap:8}}><span style={{fontWeight:600,fontSize:14}}>{m.label}</span>{m.popular && <span style={{background:'rgba(16,185,129,0.15)',color:'var(--accent)',fontSize:9,fontFamily:'Space Grotesk',fontWeight:700,padding:'2px 7px',borderRadius:10}}>POPULAR</span>}</div><div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{m.sub}</div></div>
                <div style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${selectedMethod===m.id?'var(--accent)':'var(--border2)'}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all 0.2s'}}>{selectedMethod===m.id && <div style={{width:10,height:10,borderRadius:'50%',background:'var(--accent)'}}/>}</div>
              </div>
            ))}
            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',boxShadow:'0 0 16px rgba(16,185,129,0.4)',fontSize:14,padding:'14px'}} onClick={handleMethodNext} disabled={!selectedMethod}>Continue →</button>
          </div>
        )}
        {step === 3 && (
          <div className="pay-step-body">
            <div style={{marginBottom:20,padding:'12px 16px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:12,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:12,color:'var(--muted)'}}>Total: <strong style={{color:'var(--accent)',fontFamily:'Space Grotesk',fontSize:15}}>₹{breakdown.total.toLocaleString('en-IN')}</strong></div>
              <button onClick={()=>setStep(2)} style={{background:'none',border:'1px solid var(--border2)',color:'var(--muted)',borderRadius:8,padding:'4px 10px',cursor:'pointer',fontFamily:'Space Grotesk',fontSize:10}}>Change</button>
            </div>
            {selectedMethod === 'upi' && (<div><div className="upi-apps">{UPI_APPS.map(app=>(<div key={app.id} className={`upi-app-btn${selectedUPIApp===app.id?' selected':''}`} onClick={()=>{setSelectedUPIApp(app.id);setUpiId('');}}><div className="app-icon">{app.icon}</div><div className="app-name">{app.name}</div></div>))}</div><div style={{textAlign:'center',color:'var(--muted)',fontSize:12,margin:'12px 0'}}>— OR enter UPI ID —</div><input value={upiId} onChange={e=>{setUpiId(e.target.value);setSelectedUPIApp('');}} placeholder="yourname@paytm" style={{fontFamily:'Space Grotesk'}}/></div>)}
            {selectedMethod === 'netbanking' && (<div><label className="pay-input-label">Select Your Bank</label><div className="bank-list">{BANKS.map(bank=>(<div key={bank} className={`bank-btn${selectedBank===bank?' selected':''}`} onClick={()=>setSelectedBank(bank)}><span style={{fontSize:16}}>🏦</span><span>{bank}</span></div>))}</div></div>)}
            {selectedMethod === 'card' && (
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                <div><label className="pay-input-label">Card Number *</label><input value={cardData.number} onChange={e=>setCardData(d=>({...d,number:handleFormatCard(e.target.value)}))} placeholder="1234 5678 9012 3456" maxLength={19} style={{fontFamily:'Space Grotesk',letterSpacing:'2px'}}/></div>
                <div><label className="pay-input-label">Cardholder Name *</label><input value={cardData.name} onChange={e=>setCardData(d=>({...d,name:e.target.value.toUpperCase()}))} placeholder="NAME AS ON CARD"/></div>
                <div className="pay-input-row">
                  <div><label className="pay-input-label">Expiry *</label><input value={cardData.expiry} onChange={e=>setCardData(d=>({...d,expiry:handleFormatExpiry(e.target.value)}))} placeholder="MM/YY" maxLength={5}/></div>
                  <div><label className="pay-input-label">CVV *</label><input type="password" value={cardData.cvv} onChange={e=>setCardData(d=>({...d,cvv:e.target.value.replace(/\D/g,'').slice(0,4)}))} placeholder="•••" maxLength={4}/></div>
                </div>
              </div>
            )}
            {(selectedMethod==='razorpay'||selectedMethod==='paypal') && (<div style={{textAlign:'center',padding:'24px 0'}}><div style={{fontSize:48,marginBottom:16}}>{selectedMethod==='razorpay'?'⚡':'🌐'}</div><h4 style={{fontFamily:'Newsreader',fontSize:20,marginBottom:8}}>{selectedMethod==='razorpay'?'Razorpay Smart Checkout':'PayPal International'}</h4></div>)}
            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:20,boxShadow:'0 0 16px rgba(16,185,129,0.4)',fontSize:14,padding:'14px'}} onClick={processPayment}>🔒 Pay ₹{breakdown.total.toLocaleString('en-IN')} Securely</button>
          </div>
        )}
        {step === 4 && (<div className="pay-step-body" style={{textAlign:'center',padding:'48px 28px'}}><div style={{width:72,height:72,borderRadius:'50%',border:'3px solid var(--accent)',borderTop:'3px solid transparent',animation:'spin 0.8s linear infinite',margin:'0 auto 24px'}}/><h3 style={{fontFamily:'Newsreader',fontSize:24,marginBottom:8}}>Processing Payment</h3><p style={{color:'var(--muted)',fontSize:13,marginBottom:20}}>Please wait...</p><div className="pay-processing-bar"><div className="pay-processing-fill"/></div></div>)}
        {step === 5 && paymentData && (
          <div className="pay-step-body" style={{position:'relative',overflow:'hidden'}}>
            {confetti.map(c=>(<div key={c.id} className="confetti-piece" style={{left:`${c.left}%`,top:0,background:c.color,width:c.size,height:c.size,animationDelay:`${c.delay}s`,position:'absolute'}}/>))}
            <div style={{textAlign:'center',marginBottom:24,paddingTop:8}}><div className="pay-success-icon">🎉</div><h3 style={{fontFamily:'Newsreader',fontSize:26,marginBottom:6}}>Payment Successful!</h3></div>
            <div style={{background:'var(--surface2)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:14,padding:'18px 20px',marginBottom:16}}>
              <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',fontFamily:'Space Grotesk',fontWeight:700,color:'var(--accent)',fontSize:16,borderTop:'1px dashed rgba(255,255,255,0.1)'}}><span>Total Paid</span><span>₹{paymentData.breakdown.total.toLocaleString('en-IN')}</span></div>
            </div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}><button className="btn btn-primary" style={{flex:1,justifyContent:'center'}} onClick={downloadReceipt}>📄 Download Receipt</button><button className="btn btn-secondary" style={{flex:1,justifyContent:'center'}} onClick={onClose}>Continue →</button></div>
          </div>
        )}
      </div>
    </div>
  );
}

// ===================== NOTIFICATION BELL =====================
function NotificationBell({onNav}){
  const [open,setOpen]=useState(false);const [notifications,setNotifications]=useState([]);const [ringing,setRinging]=useState(false);const prevCountRef=useRef(0);const dropRef=useRef(null);
  useEffect(()=>{const load=()=>{const notifs=DB.get('notifications',[]);setNotifications([...notifs].reverse());const unread=notifs.filter(n=>!n.read).length;if(unread>prevCountRef.current){setRinging(true);setTimeout(()=>setRinging(false),700);}prevCountRef.current=unread;};load();const i=setInterval(load,2000);return()=>clearInterval(i);},[]);
  useEffect(()=>{const handleClick=(e)=>{if(dropRef.current&&!dropRef.current.contains(e.target))setOpen(false);};document.addEventListener('mousedown',handleClick);return()=>document.removeEventListener('mousedown',handleClick);},[]);
  const unreadCount=notifications.filter(n=>!n.read).length;
  const markAllRead=()=>{const notifs=DB.get('notifications',[]);notifs.forEach(n=>n.read=true);DB.set('notifications',notifs);setNotifications([...notifs].reverse());};
  const getIcon=(type)=>{if(type==='seller_docs_submitted')return'📋';if(type==='seller_verified')return'✅';if(type==='seller_rejected')return'❌';if(type==='approval_request')return'🏷';if(type==='payment')return'💰';if(type==='bid')return'🔨';return'🔔';};
  return(
    <div style={{position:'relative'}} ref={dropRef}>
      <button className={`notif-bell${ringing?' ringing':''}`} onClick={()=>{setOpen(o=>!o);if(!open&&unreadCount>0)markAllRead();}}>🔔{unreadCount>0&&<div className="notif-badge">{unreadCount>9?'9+':unreadCount}</div>}</button>
      {open&&(<div className="notif-dropdown">
        <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}><span style={{fontFamily:'Space Grotesk',fontSize:11,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase'}}>Notifications</span>{notifications.length>0&&<span style={{fontSize:11,color:'var(--accent)',cursor:'pointer'}} onClick={markAllRead}>Mark all read</span>}</div>
        <div style={{maxHeight:360,overflowY:'auto'}}>
          {notifications.length===0?(<div style={{padding:'32px 16px',textAlign:'center',color:'var(--muted)',fontSize:13}}>No notifications yet</div>):notifications.map((n,i)=>(<div key={i} className={`notif-item${!n.read?' unread':''}`} onClick={()=>{if(n.type==='seller_docs_submitted'||n.type==='seller_verified')onNav('admin');}}><span style={{fontSize:18,flexShrink:0}}>{getIcon(n.type)}</span><div style={{flex:1,minWidth:0}}><div style={{fontSize:12,lineHeight:1.4}}>{n.message}</div><div style={{fontSize:10,color:'var(--muted2)',marginTop:3}}>{new Date(n.time).toLocaleString('en-IN')}</div></div></div>))}
        </div>
      </div>)}
    </div>
  );
}

// ===================== BIDDING MODAL =====================
function BiddingModal({product,user,onClose,onBid,addToast,onPayNow}){
  const [amount,setAmount]=useState('');const [bids,setBids]=useState(product.bids||[]);const [curBid,setCurBid]=useState(product.currentBid);const [flash,setFlash]=useState(false);const bidsEndRef=useRef(null);
  useEffect(()=>{const i=setInterval(()=>{const products=DB.get('products',[]);const p=products.find(x=>x.id===product.id);if(p&&p.currentBid!==curBid){setCurBid(p.currentBid);setBids(p.bids||[]);setFlash(true);setTimeout(()=>setFlash(false),800);}},1500);return()=>clearInterval(i);},[product.id,curBid]);
  useEffect(()=>bidsEndRef.current?.scrollIntoView({behavior:'smooth'}),[bids]);
  const isUserWinning = user && user.role==='user' && bids.length>0 && bids[bids.length-1]?.email===user.email;
  const payments = DB.get('payments',[]);
  const alreadyPaid = payments.some(p=>p.productId===product.id&&p.userEmail===user?.email);

  const imgSrc=Array.isArray(product.images)&&product.images.length>0?product.images[0]:product.image;

            <button onClick={onClose} style={{background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:8,width:32,height:32,cursor:'pointer',fontSize:16}}>×</button>

            <div style={{borderRadius:12,overflow:'hidden',marginBottom:16,aspectRatio:'4/3'}}><img src={imgSrc} alt={product.title} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>{e.target.onerror=null;e.target.src='https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Antique-books-woodward.jpg/960px-Antique-books-woodward.jpg'}}/></div>
            <div className={flash?'bid-flash':''} style={{background:'var(--surface2)',borderRadius:12,padding:16,marginBottom:12,textAlign:'center'}}>
              <div className="label" style={{fontSize:9,letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--muted)',marginBottom:4}}>Current Highest Bid</div>
              <div style={{fontFamily:'Newsreader',fontSize:22,fontWeight:700,color:'var(--accent)'}}>₹{curBid.toLocaleString('en-IN')}</div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <div style={{background:'var(--surface2)',borderRadius:10,padding:10,textAlign:'center'}}><div style={{fontFamily:'Space Grotesk',fontSize:16,fontWeight:700}}>{bids.length}</div><div style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.08em'}}>Bids</div></div>
              <div style={{background:'var(--surface2)',borderRadius:10,padding:10,textAlign:'center'}}><div style={{fontFamily:'Space Grotesk',fontSize:16,fontWeight:700}}>{new Set(bids.map(b=>b.email)).size}</div><div style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.08em'}}>Bidders</div></div>
            </div>

            <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',fontFamily:'Space Grotesk',fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',display:'flex',alignItems:'center',gap:6}}><div className="dot-pulse" style={{background:'var(--accent)'}}/>Live Bid Feed</div>
            <div style={{flex:1,overflowY:'auto',maxHeight:220,padding:'12px 20px',display:'flex',flexDirection:'column',gap:8}}>
              {bids.length===0?<div style={{color:'var(--muted)',fontSize:13,textAlign:'center',padding:'20px 0'}}>No bids yet. Be the first!</div>:[...bids].reverse().map((b,i)=>(<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',background:'var(--surface2)',borderRadius:8,border:b.email===user?.email?'1px solid rgba(16,185,129,0.3)':'1px solid transparent'}}><div><span style={{fontWeight:600,fontSize:13}}>{b.user}</span>{b.email===user?.email&&<span style={{color:'var(--accent)',fontSize:10,marginLeft:6}}>(You)</span>}</div><span style={{fontFamily:'Space Grotesk',fontWeight:700,color:'var(--accent)',fontSize:13}}>₹{b.amount.toLocaleString('en-IN')}</span></div>))}
              <div ref={bidsEndRef}/>

            {user&&user.role==='user'&&!alreadyPaid?(<div style={{padding:'16px 20px',borderTop:'1px solid var(--border)'}}><div className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:8}}>Min Next Bid: ₹{(curBid+1000).toLocaleString('en-IN')}</div><div style={{display:'flex',gap:8}}><input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder={`₹${(curBid+1000).toLocaleString('en-IN')}`} min={curBid+1000} step={500} onKeyDown={e=>e.key==='Enter'&&placeBid()} style={{flex:1}}/><button className="btn btn-primary" onClick={placeBid} style={{whiteSpace:'nowrap',boxShadow:'0 0 12px rgba(16,185,129,0.4)'}}>Place Bid</button></div></div>):(<div style={{padding:'16px 20px',borderTop:'1px solid var(--border)',textAlign:'center',color:'var(--muted)',fontSize:13}}>{user?alreadyPaid?'✅ Payment Complete':'':'Please login to place bids'}</div>)}
          </div>
        </div>
      </div>
    </div>
  );
}

// ===================== PRODUCT CARD =====================
function ProductCard({product,user,onClick}){
  const isLive=product.status==='live'&&product.approved;
  const isSold=product.status==='sold';
  const isStartingSoon=!product.approved&&product.status!=='sold'&&product.status!=='rejected';
  const isRejected=product.status==='rejected';
  const imgSrc=Array.isArray(product.images)&&product.images.length>0?product.images[0]:product.image;
  const payments=DB.get('payments',[]);
  const isUserWinner=user&&user.role==='user'&&product.bids?.length>0&&product.bids[product.bids.length-1]?.email===user.email&&!payments.some(p=>p.productId===product.id&&p.userEmail===user.email);
  return(
    <ElectricCard style={{cursor:'pointer'}}>
      <div onClick={()=>onClick(product)}>
        <div style={{position:'relative',aspectRatio:'4/3',overflow:'hidden'}}>
          <img src={imgSrc} alt={product.title} loading="lazy" style={{width:'100%',height:'100%',objectFit:'cover',transition:'transform 0.4s'}} onMouseOver={e=>e.target.style.transform='scale(1.05)'} onMouseOut={e=>e.target.style.transform='scale(1)'} onError={e=>{e.target.onerror=null;e.target.src='https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Antique-books-woodward.jpg/960px-Antique-books-woodward.jpg'}}/>
          <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(5,5,5,0.8) 0%,transparent 50%)'}}/>
          <div style={{position:'absolute',top:12,left:12}}>
            {isLive&&<span className="badge badge-live"><div className="dot-pulse"/>Live</span>}
            {isSold&&<span className="badge badge-sold">Sold</span>}
            {isRejected&&<span className="badge badge-rejected">Rejected</span>}
            {isStartingSoon&&<span className="badge badge-soon">⏳ Starting Soon</span>}
          </div>
          <div style={{position:'absolute',top:12,right:12,background:'rgba(0,0,0,0.7)',borderRadius:8,padding:'4px 8px',fontFamily:'Space Grotesk',fontSize:10,fontWeight:600,color:'var(--muted)'}}>{product.year}</div>
          {isUserWinner&&isLive&&<div style={{position:'absolute',bottom:12,left:0,right:0,textAlign:'center'}}><span style={{background:'var(--accent)',color:'#000',fontFamily:'Space Grotesk',fontSize:10,fontWeight:700,padding:'4px 12px',borderRadius:12}}>🏆 YOU'RE WINNING</span></div>}
        </div>
        <div style={{padding:'16px 18px 18px'}}>
          <h3 style={{fontFamily:'Newsreader',fontSize:17,marginBottom:4,lineHeight:1.3,fontWeight:600}}>{product.title}</h3>
          <p style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk',letterSpacing:'0.05em',marginBottom:14}}>{product.sellerName}</p>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
            <div><div style={{fontSize:10,color:'var(--muted2)',textTransform:'uppercase',letterSpacing:'0.1em',fontFamily:'Space Grotesk',marginBottom:2}}>{isStartingSoon?'Starting Bid':'Current Bid'}</div><div style={{fontFamily:'Newsreader',fontSize:20,fontWeight:700,color:isStartingSoon?'var(--muted)':'var(--accent)'}}>₹{product.currentBid.toLocaleString('en-IN')}</div></div>
            {isLive&&product.auctionEndTime&&(<div style={{textAlign:'right'}}><div style={{fontSize:9,color:'var(--muted2)',textTransform:'uppercase',letterSpacing:'0.1em',fontFamily:'Space Grotesk',marginBottom:2}}>Ends In</div><CountdownTimer endTime={product.auctionEndTime}/></div>)}
          </div>
          {(product.bids||[]).length>0&&<div style={{marginTop:10,fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk'}}>{(product.bids||[]).length} bids • {new Set((product.bids||[]).map(b=>b.email)).size} bidders</div>}
        </div>
      </div>
    </ElectricCard>
  );
}

        <div style={{display:'flex',flexDirection:'column',gap:14}}>

          <CaptchaWidget onVerify={setCaptchaOk} verified={captchaOk}/>

function SignupPage({onNav,onLogin,addToast}){
  const [role,setRole]=useState('user');const [step,setStep]=useState(0);const [name,setName]=useState('');const [email,setEmail]=useState('');const [pwd,setPwd]=useState('');const [shop,setShop]=useState('');const [captchaOk,setCaptchaOk]=useState(false);const [phoneVerified,setPhoneVerified]=useState(false);const [verifiedPhone,setVerifiedPhone]=useState('');const [loading,setLoading]=useState(false);const [formErr,setFormErr]=useState('');
  const STEPS_USER=['Verify Human','Your Details','Phone OTP'];const STEPS_SELLER=['Verify Human','Business Details','Phone OTP','Upload Documents'];const steps=role==='user'?STEPS_USER:STEPS_SELLER;
  const nextStep=()=>{setFormErr('');if(step===0){if(!captchaOk){setFormErr('Complete CAPTCHA verification first');return;}setStep(1);}else if(step===1){if(!name||!email||!pwd){setFormErr('Fill all required fields');return;}if(pwd.length<6){setFormErr('Password min 6 characters');return;}if(email===_A_E){setFormErr('Email not available');return;}const users=DB.get('users',[]);const sellers=DB.get('sellers',[]);if(users.find(u=>u.email===email)||sellers.find(s=>s.email===email)){setFormErr('Email already registered');return;}if(role==='seller'&&!shop){setFormErr('Shop name required');return;}setStep(2);}};
  const onPhoneVerified=(p)=>{setVerifiedPhone(p);setPhoneVerified(true);if(role==='user'){const users=DB.get('users',[]);users.push({email,password:hashPwd(pwd),name,phone:p,phoneVerified:true,role:'user',createdAt:Date.now()});DB.set('users',users);onLogin({email,name,role:'user',phone:p});addToast(`Welcome to AuctionVault, ${name}!`,'success');}else{setStep(3);}};
  const onDocsUploaded=(uploadedDocs)=>{setLoading(true);setTimeout(()=>{const sellers=DB.get('sellers',[]);const newSeller={email,password:hashPwd(pwd),name,shopName:shop||name+' Auctions',phone:verifiedPhone,phoneVerified:true,role:'seller',verificationStatus:'pending',verificationDocs:uploadedDocs,createdAt:Date.now()};sellers.push(newSeller);DB.set('sellers',sellers);const notifs=DB.get('notifications',[]);notifs.push({id:'n'+Date.now(),type:'seller_docs_submitted',message:`New seller "${name}" submitted documents for verification`,time:Date.now(),read:false,sellerEmail:email});DB.set('notifications',notifs);setLoading(false);onLogin({email,name,role:'seller',phone:verifiedPhone,verificationStatus:'pending'});addToast('Documents submitted! Awaiting admin verification.','success');},800);};
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20,position:'relative',zIndex:1}}>
      <SquareGlowBox style={{width:'100%',maxWidth:520}}>

        {step===0&&(<div style={{display:'flex',gap:8,marginBottom:20,background:'var(--surface2)',padding:4,borderRadius:12}}>{['user','seller'].map(r=>(<button key={r} onClick={()=>{setRole(r);setCaptchaOk(false);}} style={{flex:1,padding:'10px',borderRadius:9,border:'none',cursor:'pointer',fontFamily:'Space Grotesk',fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',transition:'all 0.2s',background:role===r?'var(--accent)':'transparent',color:role===r?'#000':'var(--muted)'}}>{r==='user'?'Bidder':'Seller'}</button>))}</div>)}
        <StepIndicator steps={steps} current={step}/>
        {step===0&&(<div><CaptchaWidget onVerify={ok=>{setCaptchaOk(ok);}} verified={captchaOk}/>{formErr&&<div style={{color:'var(--danger)',fontSize:12,marginBottom:8,textAlign:'center'}}>{formErr}</div>}<button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:12,boxShadow:'0 0 12px rgba(16,185,129,0.3)'}} onClick={nextStep} disabled={!captchaOk}>Continue →</button></div>)}
        {step===1&&(<div style={{display:'flex',flexDirection:'column',gap:13}}><div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Full Name *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Your full name"/></div><div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Email Address *</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com"/></div><div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Password *</label><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••"/></div>{role==='seller'&&(<div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Shop / Gallery Name *</label><input value={shop} onChange={e=>setShop(e.target.value)} placeholder="Your auction house name"/></div>)}{formErr&&<div style={{color:'var(--danger)',fontSize:12}}>{formErr}</div>}<div style={{display:'flex',gap:8}}><button className="btn btn-secondary" style={{flex:1}} onClick={()=>{setStep(0);setFormErr('');}}>← Back</button><button className="btn btn-primary" style={{flex:2,justifyContent:'center',boxShadow:'0 0 12px rgba(16,185,129,0.3)'}} onClick={nextStep}>Continue →</button></div></div>)}

      </SquareGlowBox>
    </div>
  );
}

      {payProduct&&user&&(<PaymentGatewayModal product={payProduct} user={user} wonAmount={payAmount} onClose={()=>{setPayProduct(null);setPayAmount(0);loadProducts();}} onSuccess={(pd)=>{addToast(`Payment of ₹${pd.breakdown.total.toLocaleString('en-IN')} successful!`,'success');loadProducts();}} addToast={addToast}/>)}
    </div>
  );
}

// ===================== DOCUMENT SCANNER =====================
function DocumentScanner({doc,onResult,onClose}){
  const [scanning,setScanning]=useState(false);const [scanDone,setScanDone]=useState(false);const [scanResult,setScanResult]=useState(null);const [notes,setNotes]=useState('');const [decision,setDecision]=useState('');
  const runScan=()=>{
    setScanning(true);
    setTimeout(()=>{
      const fileName=doc.name||'document';const fileSizeKB=((doc.size||0)/1024).toFixed(1);const uploadDate=new Date(doc.uploadedAt||Date.now());const isPDF=doc.type==='application/pdf';const isImage=doc.type?.startsWith('image/');const ext=(fileName.split('.').pop()||'').toUpperCase();const sizeScore=Math.min(60+(doc.size||0)/50000,96);const confidence=sizeScore.toFixed(1);const baseRisk=isPDF?12:20;const riskScore=Math.floor(baseRisk+(Math.sin((doc.size||1)*0.001)*8));const docTypeLabel=isPDF?'PDF Document':isImage?`Image Document (${ext})`:`Document (${ext})`;const registrationNo=`REG-${(doc.size||0).toString().slice(-4).padStart(4,'0')}-${uploadDate.getFullYear()}`;
      setScanResult({extractedText:`DOCUMENT SCAN RESULTS\n━━━━━━━━━━━━━━━━━━━━━━\nFile: ${fileName}\nType: ${docTypeLabel}\nSize: ${fileSizeKB} KB\nDate: ${uploadDate.toLocaleDateString('en-IN')}\n\nRegistration: ${registrationNo}\nFormat Valid: ${isPDF||isImage?'YES ✓':'UNKNOWN'}\nChecksum: ${btoa(fileName).slice(0,16).toUpperCase()}`,confidence,docType:docTypeLabel,registrationNo,isDuplicate:false,riskScore:Math.abs(riskScore),formatValid:isPDF||isImage});
      setScanDone(true);setScanning(false);
    },2200);
  };
  const submitDecision=()=>{if(!decision)return;onResult(decision,notes);};
  return(
    <div className="doc-preview-modal" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="doc-preview-inner">
        <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
          <div><h3 style={{fontFamily:'Newsreader',fontSize:18,marginBottom:2}}>Document Scanner</h3><div style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk'}}>{doc.name}</div></div>
          <button onClick={onClose} style={{background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:8,width:32,height:32,cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
        </div>
        <div className="doc-preview-body">
          <div className="doc-preview-sidebar">
            <div style={{position:'relative',borderRadius:10,overflow:'hidden',background:'#000',minHeight:160,marginBottom:12}}>
              {doc.type?.startsWith('image/')?(<img src={doc.data} alt={doc.name} style={{width:'100%',display:'block',borderRadius:10,maxHeight:240,objectFit:'cover'}}/>):(<div style={{padding:20,textAlign:'center',color:'var(--muted)'}}><div style={{fontSize:40,marginBottom:8}}>📋</div><div style={{fontSize:12,fontFamily:'Space Grotesk',fontWeight:600,wordBreak:'break-all'}}>{doc.name}</div></div>)}
              {scanning&&(<div className="scan-overlay"><div className="scan-line"/><div className="scan-corner tl"/><div className="scan-corner tr"/><div className="scan-corner bl"/><div className="scan-corner br"/></div>)}
            </div>
            <button className="btn btn-primary btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={runScan} disabled={scanning||scanDone}>{scanning?'Scanning...':scanDone?'✓ Done':'🔍 Run Scan'}</button>
          </div>
          <div className="doc-preview-main">
            {scanDone&&scanResult&&(<div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10,marginBottom:16}}>
                {[{l:'Confidence',v:scanResult.confidence+'%',c:'var(--accent)'},{l:'Risk Score',v:scanResult.riskScore+'/100',c:scanResult.riskScore>50?'var(--danger)':scanResult.riskScore>25?'var(--warn)':'var(--accent)'}].map(s=>(<div key={s.l} style={{background:'var(--surface2)',borderRadius:10,padding:'12px 14px'}}><div style={{fontSize:9,color:'var(--muted2)',fontFamily:'Space Grotesk',textTransform:'uppercase'}}>{s.l}</div><div style={{fontSize:15,fontWeight:700,color:s.c,fontFamily:'Space Grotesk',marginTop:2}}>{s.v}</div></div>))}
              </div>
              <div style={{background:'var(--surface2)',borderRadius:10,padding:14,marginBottom:16}}><pre style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk',whiteSpace:'pre-wrap'}}>{scanResult.extractedText}</pre></div>
              <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Admin notes..." rows={2} style={{resize:'vertical',marginBottom:14}}/>
              <div className="doc-scan-actions">
                {[{d:'verified',label:'✓ Verified',bc:'var(--accent)'},{d:'fake',label:'⚠ Fake',bc:'var(--warn)'},{d:'rejected',label:'✕ Reject',bc:'var(--danger)'}].map(b=>(<button key={b.d} onClick={()=>setDecision(b.d)} style={{border:`2px solid ${b.bc}`,color:b.bc,background:decision===b.d?`${b.bc}20`:'transparent',padding:'10px 18px',borderRadius:10,cursor:'pointer',fontFamily:'Space Grotesk',fontSize:12,fontWeight:600,flex:'1 1 auto'}}>{b.label}</button>))}
              </div>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:8}} onClick={submitDecision} disabled={!decision}>Submit Decision →</button>
            </div>)}
            {!scanDone&&!scanning&&(<div style={{textAlign:'center',padding:'32px 0',color:'var(--muted)'}}><div style={{fontSize:40,marginBottom:12}}>🔍</div><p>Click "Run Scan" to verify this document</p></div>)}
            {scanning&&(<div style={{textAlign:'center',padding:'32px 0',color:'var(--muted)'}}><div style={{width:48,height:48,border:'3px solid var(--accent)',borderTop:'3px solid transparent',borderRadius:'50%',animation:'spin 0.8s linear infinite',margin:'0 auto 16px'}}/><p>Scanning...</p></div>)}
          </div>
        </div>
      </div>
    </div>
  );
}

function AdminPanel({user,addToast}){

  useEffect(()=>{loadData();const i=setInterval(loadData,2000);return()=>clearInterval(i)},[]);

  const approveProduct=(id,approve)=>{const prods=DB.get('products',[]);const i=prods.findIndex(p=>p.id===id);if(i<0)return;prods[i].approved=approve;if(approve){prods[i].status='live';prods[i].auctionEndTime=Date.now()+7200000;}else{prods[i].status='rejected';}DB.set('products',prods);loadData();addToast(approve?'Product approved & auction started!':'Rejected','success');};
