  const markSold=(id)=>{const prods=DB.get('products',[]);const i=prods.findIndex(p=>p.id===id);if(i<0)return;prods[i].status='sold';DB.set('products',prods);loadData();addToast('Marked as sold','success');};
  const delProduct=(id)=>{if(!window.confirm('Delete?'))return;DB.set('products',DB.get('products',[]).filter(p=>p.id!==id));loadData();addToast('Deleted','info');};
  const addProduct=()=>{if(!adminForm.title||!adminForm.year||!adminForm.basePrice){addToast('Fill required fields','error');return;}const finalImages=adminImages.length>0?adminImages:adminForm.image?[adminForm.image]:['https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Antique-books-woodward.jpg/960px-Antique-books-woodward.jpg'];const np={id:'ap'+Date.now(),title:adminForm.title,year:parseInt(adminForm.year),basePrice:parseInt(adminForm.basePrice),currentBid:parseInt(adminForm.basePrice),images:finalImages,image:finalImages[0],status:'live',approved:true,sellerName:'AuctionVault Official',sellerId:'admin',description:adminForm.description,bids:[],auctionEndTime:Date.now()+7200000,createdAt:Date.now()};const all=DB.get('products',[]);all.push(np);DB.set('products',all);setAdminForm({title:'',year:'',basePrice:'',description:'',image:''});setAdminImages([]);loadData();addToast('Product added & auction started!','success');};
  const handleDocScanResult=(sellerEmail,docIdx,decision,notes)=>{const allSellers=DB.get('sellers',[]);const si=allSellers.findIndex(s=>s.email===sellerEmail);if(si<0)return;if(decision==='verified'){allSellers[si].verificationStatus='verified';allSellers[si].verifiedAt=Date.now();const notifs=DB.get('notifications',[]);notifs.push({id:'n'+Date.now(),type:'seller_verified',message:`Seller "${allSellers[si].name}" has been verified!`,time:Date.now(),read:false});DB.set('notifications',notifs);addToast(`${allSellers[si].name} verified!`,'success');}else{allSellers[si].verificationStatus='rejected';allSellers[si].rejectionReason=decision==='fake'?'Document appears fraudulent':'Rejected';const notifs=DB.get('notifications',[]);notifs.push({id:'n'+Date.now(),type:'seller_rejected',message:`Seller "${allSellers[si].name}" verification ${decision==='fake'?'flagged as fake':'rejected'}`,time:Date.now(),read:false});DB.set('notifications',notifs);addToast(`Seller ${decision}`,'info');}DB.set('sellers',allSellers);setScanDoc(null);setScanSeller(null);loadData();};
  const generateReport=()=>{if(!window.jspdf){addToast('PDF loading, retry','error');return;}setGeneratingPDF(true);setTimeout(()=>{try{PDFReports.generateAdminReport(reportPeriod);addToast(`${reportPeriod} PDF report downloaded!`,'success');}catch(e){addToast('Error generating PDF','error');}setGeneratingPDF(false);},100);};

  const allBids=products.flatMap(p=>(p.bids||[]).map(b=>({...b,product:p.title})));
  const liveProd=products.filter(p=>p.status==='live'&&p.approved);
  const pendingProd=products.filter(p=>!p.approved&&p.status!=='rejected');
  const soldProd=products.filter(p=>p.status==='sold');
  const pendingSellers=sellers.filter(s=>s.verificationStatus==='pending');
  const totalRevenue=payments.reduce((s,p)=>s+p.breakdown.total,0);
  const onlineEmails=new Set(onlineUsers.map(u=>u.email));

  return(
    <div style={{paddingTop:80,minHeight:'100vh',position:'relative',zIndex:1}}>
      <div className="section">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:32,flexWrap:'wrap',gap:16}}>
          <div><h1 style={{fontFamily:'Newsreader',fontSize:36,fontStyle:'italic',marginBottom:4}}>Admin Control Panel</h1><p style={{color:'var(--muted)',fontSize:13,fontFamily:'Space Grotesk'}}>{new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p></div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
            {pendingProd.length>0&&<div style={{background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.3)',borderRadius:12,padding:'8px 16px',display:'flex',alignItems:'center',gap:8}}><div className="dot-pulse" style={{background:'var(--danger)'}}/><span style={{fontFamily:'Space Grotesk',fontSize:11,color:'var(--danger)'}}>{pendingProd.length} pending products</span></div>}
            {pendingSellers.length>0&&<div style={{background:'rgba(245,158,11,0.15)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:12,padding:'8px 16px',display:'flex',alignItems:'center',gap:8,cursor:'pointer'}} onClick={()=>setTab('seller_verify')}><div className="dot-pulse" style={{background:'var(--warn)'}}/><span style={{fontFamily:'Space Grotesk',fontSize:11,color:'var(--warn)'}}>{pendingSellers.length} sellers need verification →</span></div>}
          </div>
        </div>

        {/* Key Stats */}
        <div className="mini-stat-row" style={{marginBottom:24}}>
          {[{label:'Total Users',val:users.length,color:'var(--info)'},{label:'Sellers',val:sellers.length,color:'var(--warn)'},{label:'Online Now',val:onlineUsers.length,color:'var(--accent)'},{label:'Live Auctions',val:liveProd.length,color:'var(--accent)'},{label:'Total Bids',val:allBids.length,color:'var(--accent)'},{label:'Payments',val:payments.length,color:'var(--info)'},{label:'Total Revenue',val:'₹'+(totalRevenue/1000).toFixed(0)+'k',color:'var(--accent)'},{label:'Sold Items',val:soldProd.length,color:'var(--info)'}].map(s=>(
            <div key={s.label} className="mini-stat">
              <div className="mini-stat-val" style={{color:s.color,fontSize:s.label==='Total Revenue'?18:22}}>{s.val}</div>
              <div className="mini-stat-lbl">{s.label}</div>
            </div>
          ))}
        </div>

        <div className="tabs">
          {[['analytics','📊 Analytics'],['seller_verify',`Verify${pendingSellers.length>0?' ('+pendingSellers.length+')':''}`],['approvals',`Approvals${pendingProd.length>0?' ('+pendingProd.length+')':''}`],['auctions','Auctions'],['payments','Payments'],['bids','Bid Feed'],['users','Users'],['add','Add Product'],['reports','Reports']].map(([t,l])=>(<button key={t} className={`tab${tab===t?' active':''}`} onClick={()=>setTab(t)}>{l}</button>))}
        </div>

        {tab==='analytics'&&(
          <div>
            <div className="chart-grid">
              {/* Revenue Trend */}
              <div className="analytics-section">
                <div className="chart-header"><h4 style={{margin:0}}>Revenue (Last 7 Days)</h4><span style={{fontSize:11,color:'var(--accent)',fontFamily:'Space Grotesk',fontWeight:700}}>₹{totalRevenue.toLocaleString('en-IN')} total</span></div>
                <AdminRevenueChart payments={payments}/>
              </div>

              {/* Bid Activity */}
              <div className="analytics-section">
                <div className="chart-header"><h4 style={{margin:0}}>Bid Activity (Last 12hr)</h4><span className="badge badge-live" style={{fontSize:9}}><div className="dot-pulse"/>Live</span></div>
                <BidActivityChart products={products}/>
              </div>
            </div>

            <div className="chart-grid">
              {/* Platform Health */}
              <div className="analytics-section">
                <h4>Platform Health</h4>
                <PlatformHealthBars products={products} sellers={sellers} users={users} payments={payments}/>
              </div>

              {/* Revenue by Era */}
              <div className="analytics-section">
                <h4>Revenue by Era</h4>
                <RevenueDonutChart products={products}/>
              </div>
            </div>

            {/* Key Insights */}
            <div className="chart-grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))'}}>
              {[
                {icon:'💰',title:'Platform Revenue',desc:`₹${totalRevenue.toLocaleString('en-IN')} from ${payments.length} transactions`,color:'rgba(16,185,129,0.1)',border:'rgba(16,185,129,0.25)'},
                {icon:'👥',title:'User Growth',desc:`${users.length} bidders, ${sellers.length} sellers registered`,color:'rgba(59,130,246,0.1)',border:'rgba(59,130,246,0.25)'},
                {icon:'🔨',title:'Auction Activity',desc:`${allBids.length} total bids across ${products.length} listings`,color:'rgba(245,158,11,0.1)',border:'rgba(245,158,11,0.25)'},
                {icon:'✅',title:'Seller Verification',desc:`${sellers.filter(s=>s.verificationStatus==='verified').length} verified, ${pendingSellers.length} pending review`,color:'rgba(167,139,250,0.1)',border:'rgba(167,139,250,0.25)'},
                {icon:'🌐',title:'Online Users',desc:`${onlineUsers.length} users active right now on platform`,color:'rgba(16,185,129,0.1)',border:'rgba(16,185,129,0.25)'},
                {icon:'📦',title:'Sold Items',desc:`${soldProd.length} items sold, ${liveProd.length} currently live`,color:'rgba(239,68,68,0.1)',border:'rgba(239,68,68,0.2)'},
              ].map((ins,i)=>(
                <div key={i} className="insight-card" style={{border:`1px solid ${ins.border}`,background:`var(--surface2)`}}>
                  <div className="insight-icon" style={{background:ins.color}}>{ins.icon}</div>
                  <div><div className="insight-title">{ins.title}</div><div className="insight-desc">{ins.desc}</div></div>
                </div>
              ))}
            </div>

            {/* Recent Activity Feed */}
            <div className="analytics-section">
              <div className="chart-header">
                <h4 style={{margin:0}}>Recent Bid Activity</h4>
                <span style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk'}}>{allBids.length} total bids</span>
              </div>
              <div className="activity-feed">
                {allBids.length===0?<div style={{textAlign:'center',padding:'24px 0',color:'var(--muted)',fontSize:13}}>No bids placed yet</div>:allBids.slice().sort((a,b)=>b.time-a.time).slice(0,10).map((b,i)=>(
                  <div key={i} className="activity-item">
                    <div className="activity-dot" style={{background:['var(--accent)','var(--info)','var(--warn)','#a78bfa'][i%4]}}></div>
                    <div><div className="activity-text"><strong>{b.user}</strong> bid <strong style={{color:'var(--accent)'}}>₹{b.amount.toLocaleString('en-IN')}</strong> on <em>{b.product}</em></div><div className="activity-time">{new Date(b.time).toLocaleString('en-IN')}</div></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {tab==='payments'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><h3 style={{fontFamily:'Newsreader',fontSize:22}}>Payment Transactions</h3><div style={{fontFamily:'Space Grotesk',fontSize:12,color:'var(--accent)',fontWeight:700}}>Total: ₹{totalRevenue.toLocaleString('en-IN')}</div></div>
            {payments.length===0?<div style={{textAlign:'center',padding:'60px 0',color:'var(--muted)'}}><p style={{fontFamily:'Newsreader',fontSize:20}}>No payments yet</p></div>:(
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {[...payments].reverse().map((p,i)=>(
                  <div key={i} style={{background:'var(--surface)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:14,padding:'16px 20px'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10}}>
                      <div><div style={{fontWeight:600,fontSize:14,marginBottom:4}}>{p.productTitle}</div><div style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk',display:'flex',gap:12,flexWrap:'wrap'}}><span>👤 {p.userName}</span><span>💳 {p.methodLabel}</span><span>🕒 {new Date(p.timestamp).toLocaleString('en-IN')}</span></div><div style={{fontSize:10,color:'var(--muted2)',fontFamily:'Space Grotesk',marginTop:4}}>Order: {p.orderId} | Txn: {p.txnId}</div></div>
                      <div style={{textAlign:'right'}}><div style={{fontFamily:'Space Grotesk',fontWeight:700,color:'var(--accent)',fontSize:18}}>₹{p.breakdown.total.toLocaleString('en-IN')}</div><span className="badge badge-live" style={{marginTop:6}}>✓ Paid</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {tab==='seller_verify'&&(
          <div>
            <h3 style={{fontFamily:'Newsreader',fontSize:22,marginBottom:6}}>Seller Verification Queue</h3>
            <p style={{color:'var(--muted)',fontSize:13,marginBottom:20}}>Review and verify seller documents. Click "Scan" to run OCR verification.</p>
            {pendingSellers.length===0&&sellers.length===0&&(<div style={{textAlign:'center',padding:'60px 0',color:'var(--muted)',background:'var(--surface)',borderRadius:16,border:'1px solid var(--border)'}}><div style={{fontSize:48,marginBottom:12}}>👥</div><p style={{fontFamily:'Newsreader',fontSize:20}}>No sellers registered yet</p></div>)}
            {pendingSellers.length>0&&(
              <div style={{marginBottom:24}}>
                <div style={{fontFamily:'Space Grotesk',fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--warn)',marginBottom:12,display:'flex',alignItems:'center',gap:6}}><div className="dot-pulse" style={{background:'var(--warn)'}}/>Pending Verification ({pendingSellers.length})</div>
                {pendingSellers.map(s=>(
                  <div key={s.email} style={{background:'var(--surface)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:14,padding:20,marginBottom:12}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,flexWrap:'wrap',gap:12}}>
                      <div><div style={{fontWeight:700,fontSize:16,marginBottom:4}}>{s.name}</div><div style={{fontSize:12,color:'var(--muted)',fontFamily:'Space Grotesk',display:'flex',gap:12,flexWrap:'wrap'}}><span>📧 {s.email}</span><span>🏪 {s.shopName}</span></div></div>
                      <span className="badge badge-pending">Pending Verification</span>
                    </div>
                    {(s.verificationDocs||[]).length > 0 && (
                      <div style={{marginBottom:16}}>
                        <div style={{fontFamily:'Space Grotesk',fontSize:10,textTransform:'uppercase',color:'var(--muted)',marginBottom:10}}>📄 Documents ({(s.verificationDocs||[]).length})</div>
                        {(s.verificationDocs||[]).map((doc,di)=>(
                          <div key={di} className="doc-item-row">
                            <div className={`doc-icon ${doc.type==='application/pdf'?'pdf':'img'}`}>{doc.type==='application/pdf'?'📋':'🖼'}</div>
                            <div className="doc-item-row-info"><div style={{fontSize:13,fontWeight:600}}>{doc.name}</div><div style={{fontSize:10,color:'var(--muted)'}}>{(doc.size/1024).toFixed(0)}KB</div></div>
                            <div className="doc-item-row-btn"><button className="btn btn-primary btn-sm" onClick={()=>{setScanDoc({...doc,sellerEmail:s.email,docIndex:di});setScanSeller(s);}} style={{boxShadow:'0 0 8px rgba(16,185,129,0.3)'}}>🔍 Scan & Verify</button></div>
                          </div>
                        ))}
                      </div>
                    )}
                    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                      <button className="btn btn-primary btn-sm" onClick={()=>{const all=DB.get('sellers',[]);const i=all.findIndex(x=>x.email===s.email);if(i>=0){all[i].verificationStatus='verified';all[i].verifiedAt=Date.now();DB.set('sellers',all);const notifs=DB.get('notifications',[]);notifs.push({id:'n'+Date.now(),type:'seller_verified',message:`Seller "${s.name}" manually approved`,time:Date.now(),read:false});DB.set('notifications',notifs);loadData();addToast(`${s.name} verified!`,'success');}}}>✓ Approve Directly</button>
                      <button className="btn btn-danger btn-sm" onClick={()=>{const all=DB.get('sellers',[]);const i=all.findIndex(x=>x.email===s.email);if(i>=0){all[i].verificationStatus='rejected';DB.set('sellers',all);loadData();addToast('Seller rejected','info');}}}>✕ Reject</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {sellers.filter(s=>s.verificationStatus!=='pending').length>0&&(
              <div>
                <div style={{fontFamily:'Space Grotesk',fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:12}}>Processed Sellers</div>
                {sellers.filter(s=>s.verificationStatus!=='pending').map(s=>(<div key={s.email} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:'14px 18px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}><div><div style={{fontWeight:600,marginBottom:2}}>{s.name} — {s.shopName}</div><div style={{fontSize:11,color:'var(--muted)'}}>{s.email}</div></div><span className={`badge badge-${s.verificationStatus==='verified'?'live':s.verificationStatus==='rejected'?'rejected':'pending'}`}>{s.verificationStatus}</span></div>))}
              </div>
            )}
          </div>
        )}

        {tab==='approvals'&&(
          <div>
            <div style={{marginBottom:16,padding:'12px 16px',background:'rgba(16,185,129,0.06)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:12,fontSize:12,color:'var(--muted)'}}>ℹ️ Approving a product will <strong style={{color:'var(--accent)'}}>immediately start its auction</strong> with a 2-hour timer.</div>
            {pendingProd.length===0?<div style={{textAlign:'center',padding:'60px 0',color:'var(--muted)'}}>No pending approvals</div>:pendingProd.map(p=>{const imgSrc=Array.isArray(p.images)&&p.images.length>0?p.images[0]:p.image;return(<div key={p.id} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:20,marginBottom:12,display:'flex',gap:16,alignItems:'center',flexWrap:'wrap'}}><img src={imgSrc} alt={p.title} style={{width:80,height:60,borderRadius:10,objectFit:'cover'}} onError={e=>{e.target.onerror=null;e.target.src='https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Antique-books-woodward.jpg/960px-Antique-books-woodward.jpg'}}/><div style={{flex:1,minWidth:200}}><div style={{fontWeight:600,marginBottom:4}}>{p.title}</div><div style={{fontSize:12,color:'var(--muted)'}}>Seller: {p.sellerName} • Base: ₹{p.basePrice.toLocaleString('en-IN')}</div></div><div style={{display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn btn-primary btn-sm" onClick={()=>approveProduct(p.id,true)}>✓ Approve & Start</button><button className="btn btn-danger btn-sm" onClick={()=>approveProduct(p.id,false)}>✕ Reject</button></div></div>);})}
          </div>
        )}

        {tab==='auctions'&&(<div>{products.map(p=>{const imgSrc=Array.isArray(p.images)&&p.images.length>0?p.images[0]:p.image;return(<div key={p.id} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:'16px 20px',marginBottom:10,display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}><img src={imgSrc} alt={p.title} style={{width:60,height:60,borderRadius:8,objectFit:'cover'}} onError={e=>{e.target.onerror=null;e.target.src='https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Antique-books-woodward.jpg/960px-Antique-books-woodward.jpg'}}/><div style={{flex:1,minWidth:150}}><div style={{fontWeight:600,fontSize:14,marginBottom:2}}>{p.title}</div><div style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk'}}>₹{p.currentBid.toLocaleString('en-IN')} • {(p.bids||[]).length} bids</div></div><div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>{p.approved&&p.status==='live'?<span className="badge badge-live"><div className="dot-pulse"/>Live</span>:p.status==='sold'?<span className="badge badge-sold">Sold</span>:p.status==='rejected'?<span className="badge badge-rejected">Rejected</span>:!p.approved?<span className="badge badge-soon">⏳ Soon</span>:<span className="badge badge-pending">Pending</span>}{p.approved&&(p.status==='live'||p.status==='paused')&&<button className={`btn btn-sm ${p.status==='live'?'btn-warn':'btn-primary'}`} onClick={()=>toggleAuction(p.id)}>{p.status==='live'?'Pause':'Resume'}</button>}{p.status==='live'&&<button className="btn btn-sm btn-secondary" onClick={()=>markSold(p.id)}>Mark Sold</button>}<button className="btn btn-sm btn-danger" onClick={()=>delProduct(p.id)}>Del</button></div></div>);})}</div>)}

        {tab==='bids'&&(<div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,overflow:'hidden'}}><div style={{padding:'14px 20px',borderBottom:'1px solid var(--border)',fontFamily:'Space Grotesk',fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',display:'flex',gap:6,alignItems:'center'}}><div className="dot-pulse" style={{background:'var(--accent)'}}/>Live Bid Feed — {allBids.length} Total</div><div style={{maxHeight:500,overflowY:'auto'}}>{allBids.slice().reverse().map((b,i)=>(<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 20px',borderBottom:'1px solid var(--border)',fontSize:13}}><div><span style={{fontWeight:600}}>{b.user}</span><span style={{color:'var(--muted)',margin:'0 8px'}}>on</span><span style={{color:'var(--muted2)'}}>{b.product}</span></div><div style={{display:'flex',gap:16,alignItems:'center'}}><span style={{fontFamily:'Space Grotesk',color:'var(--accent)',fontWeight:700}}>₹{b.amount.toLocaleString('en-IN')}</span><span style={{fontSize:11,color:'var(--muted2)'}}>{new Date(b.time).toLocaleTimeString('en-IN')}</span></div></div>))}{allBids.length===0&&<p style={{color:'var(--muted)',textAlign:'center',padding:'40px 0'}}>No bids yet</p>}</div></div>)}

        {tab==='users'&&(
          <div>
            <div style={{background:'var(--surface)',border:'1px solid rgba(16,185,129,0.3)',borderRadius:14,padding:20,marginBottom:24}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}><div className="dot-pulse" style={{background:'var(--accent)'}}/><span style={{fontFamily:'Space Grotesk',fontSize:11,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--accent)'}}>Online Now ({onlineUsers.length})</span></div>
              {onlineUsers.length===0?<p style={{color:'var(--muted)',fontSize:13}}>No users online</p>:<div style={{display:'flex',flexWrap:'wrap',gap:8}}>{onlineUsers.map((u,i)=>(<div key={i} style={{display:'flex',alignItems:'center',gap:6,background:'rgba(16,185,129,0.08)',border:'1px solid rgba(16,185,129,0.25)',borderRadius:20,padding:'4px 12px'}}><span className="online-dot"/><span style={{fontSize:12,fontWeight:600}}>{u.name}</span><span style={{fontSize:10,color:'var(--muted)'}}>{u.role}</span></div>))}</div>}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:24}}>
              <div><h3 style={{fontFamily:'Newsreader',fontSize:20,marginBottom:12}}>Users ({users.length})</h3>{users.map(u=>(<div key={u.email} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 16px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}><div><div style={{fontWeight:600,fontSize:13}}>{u.name}</div><div style={{fontSize:11,color:'var(--muted)'}}>{u.email}</div></div><div style={{display:'flex',alignItems:'center',gap:8}}>{onlineEmails.has(u.email)?<span className="online-dot"/>:<span className="offline-dot"/>}<span className="badge badge-live" style={{fontSize:9}}>Bidder</span></div></div>))}{users.length===0&&<p style={{color:'var(--muted)',fontSize:13}}>No users yet</p>}</div>
              <div><h3 style={{fontFamily:'Newsreader',fontSize:20,marginBottom:12}}>Sellers ({sellers.length})</h3>{sellers.map(s=>(<div key={s.email} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 16px',marginBottom:8}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}><div><div style={{fontWeight:600,fontSize:13}}>{s.name}</div><div style={{fontSize:11,color:'var(--muted)'}}>{s.email}</div></div><span className={`badge badge-${s.verificationStatus==='verified'?'live':s.verificationStatus==='rejected'?'rejected':'pending'}`} style={{fontSize:9}}>{s.verificationStatus}</span></div></div>))}{sellers.length===0&&<p style={{color:'var(--muted)',fontSize:13}}>No sellers yet</p>}</div>
            </div>
          </div>
        )}

        {tab==='add'&&(
          <div style={{maxWidth:600}}>
            <h3 style={{fontFamily:'Newsreader',fontSize:22,marginBottom:20}}>Add New Auction Item</h3>
            <div style={{marginBottom:16,padding:'12px 16px',background:'rgba(16,185,129,0.06)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:12,fontSize:12,color:'var(--muted)'}}>Products added here go <strong style={{color:'var(--accent)'}}>immediately live</strong> with a 2-hour timer.</div>
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Item Title *</label><input value={adminForm.title} onChange={e=>setAdminForm(f=>({...f,title:e.target.value}))} placeholder="Item title"/></div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12}}>
                <div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Year *</label><input type="number" value={adminForm.year} onChange={e=>setAdminForm(f=>({...f,year:e.target.value}))} placeholder="Year"/></div>
                <div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Base Price (₹) *</label><input type="number" value={adminForm.basePrice} onChange={e=>setAdminForm(f=>({...f,basePrice:e.target.value}))} placeholder="Base price"/></div>
              </div>
              <div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Upload Images</label><ImageUploader images={adminImages} setImages={setAdminImages} maxImages={5}/></div>
              <div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Or Image URL</label><input value={adminForm.image} onChange={e=>setAdminForm(f=>({...f,image:e.target.value}))} placeholder="https://..."/></div>
              <div><label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:6,display:'block'}}>Description</label><textarea value={adminForm.description} onChange={e=>setAdminForm(f=>({...f,description:e.target.value}))} rows={3} placeholder="Item description..." style={{resize:'vertical'}}/></div>
              <button className="btn btn-primary" onClick={addProduct} style={{alignSelf:'flex-start',boxShadow:'0 0 12px rgba(16,185,129,0.3)'}}>Add to Auctions</button>
            </div>
          </div>
          )}

        {tab==='reports'&&(
          <div style={{maxWidth:700}}>
            <h3 style={{fontFamily:'Newsreader',fontSize:22,marginBottom:8}}>Platform Reports</h3>
            <p style={{color:'var(--muted)',fontSize:13,marginBottom:24}}>Download comprehensive PDF reports with auction data, revenue analysis, and seller performance metrics.</p>
            <div style={{background:'var(--surface)',border:'1px solid var(--border2)',borderRadius:16,padding:28,marginBottom:20}}>
              <div style={{marginBottom:20}}>
                <label className="label" style={{fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:8,display:'block'}}>Report Period</label>
                <div style={{display:'flex',gap:8,background:'var(--surface2)',padding:4,borderRadius:12,width:'fit-content'}}>
                  {['weekly','monthly'].map(p=>(<button key={p} onClick={()=>setReportPeriod(p)} style={{padding:'8px 24px',borderRadius:9,border:'none',cursor:'pointer',fontFamily:'Space Grotesk',fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',background:reportPeriod===p?'var(--accent)':'transparent',color:reportPeriod===p?'#000':'var(--muted)',transition:'all 0.2s'}}>{p}</button>))}
                </div>
              </div>
              <button className="btn btn-primary" onClick={generateReport} disabled={generatingPDF} style={{boxShadow:'0 0 12px rgba(16,185,129,0.3)',gap:8}}>
                📄 {generatingPDF?'Generating PDF...':'Download '+reportPeriod.charAt(0).toUpperCase()+reportPeriod.slice(1)+' Report (PDF)'}
              </button>
              <div style={{marginTop:12,fontSize:11,color:'var(--muted)'}}>Report includes: Seller performance, auction items, bid history, revenue & payment analysis</div>
            </div>

            {/* Quick analytics summary in reports tab */}
            <div className="analytics-section">
              <h4>Quick Revenue Summary</h4>
              <AdminRevenueChart payments={payments}/>
              <div className="legend-row" style={{marginTop:12}}>
                <div className="legend-item"><div className="legend-dot" style={{background:'#10b981'}}></div>Daily Revenue</div>
                <div className="legend-item"><div className="legend-dot" style={{background:'#3b82f6'}}></div>Transactions</div>
              </div>
            </div>
          </div>
        )}

      </div>
      {scanDoc&&scanSeller&&(
        <DocumentScanner
          doc={scanDoc}
          onResult={(decision,notes)=>handleDocScanResult(scanDoc.sellerEmail,scanDoc.docIndex,decision,notes)}
          onClose={()=>{setScanDoc(null);setScanSeller(null);}}
        />
      )}
    </div>
  );
}

// ===================== USER DASHBOARD WITH ANALYTICS =====================
function UserDashboard({user,onNav,addToast}){
  const [myBids,setMyBids]=useState([]);
  const [myPayments,setMyPayments]=useState([]);
  const [generatingPDF,setGeneratingPDF]=useState(false);
  const [payProduct,setPayProduct]=useState(null);
  const [payAmount,setPayAmount]=useState(0);
  const [tab,setTab]=useState('analytics');

  const loadData=()=>{
    const prods=DB.get('products',[]);
    const bids=[];
    prods.forEach(p=>{
      (p.bids||[]).filter(b=>b.email===user.email).forEach(b=>{
        const isHighest=p.currentBid===b.amount;
        bids.push({...b,product:p.title,productId:p.id,productObj:p,currentBid:p.currentBid,isHighest,status:p.status});
      });
    });
    setMyBids(bids.sort((a,b)=>b.time-a.time));
    setMyPayments(PaymentSystem.getMyPayments(user.email));
  };

  useEffect(()=>{loadData();const i=setInterval(loadData,3000);return()=>clearInterval(i)},[]);

  const downloadReport=()=>{
    if(!window.jspdf)return;
    setGeneratingPDF(true);
    setTimeout(()=>{
      try{PDFReports.generateUserReport(user.email,user.name);addToast('Report downloaded!','success');}
      catch(e){addToast('Error generating PDF','error');}
      setGeneratingPDF(false);
    },100);
  };

  const handlePayNow=(bid)=>{
    setPayProduct(bid.productObj);
    setPayAmount(bid.currentBid);
  };

  const allProds = DB.get('products',[]);
  const uniqueAuctions=new Set(myBids.map(b=>b.productId)).size;
  const winning=myBids.filter(b=>b.isHighest&&b.status==='live').length;
  const won=myBids.filter(b=>b.isHighest&&b.status==='sold').length;
  const totalPaid=myPayments.reduce((s,p)=>s+p.breakdown.total,0);
  const outbid=myBids.filter(b=>!b.isHighest&&b.status==='live').length;

  // Bid spend over time — unique products with my highest bid
  const byProduct = {};
  myBids.forEach(b=>{
    if(!byProduct[b.product]) byProduct[b.product]={bids:0,highest:0,status:b.status,isHighest:b.isHighest};
    byProduct[b.product].bids++;
    byProduct[b.product].highest=Math.max(byProduct[b.product].highest,b.amount);
    byProduct[b.product].isHighest=b.isHighest;
    byProduct[b.product].status=b.status;
  });
  const topItems = Object.entries(byProduct).sort((a,b)=>b[1].highest-a[1].highest).slice(0,5);

  return(
    <div style={{paddingTop:80,minHeight:'100vh',position:'relative',zIndex:1}}>
      <div className="section">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8,flexWrap:'wrap',gap:12}}>
          <h1 style={{fontFamily:'Newsreader',fontSize:36,fontStyle:'italic'}}>My Dashboard</h1>
          <button className="btn btn-secondary" onClick={downloadReport} disabled={generatingPDF} style={{gap:6}}>
            {generatingPDF?'Generating...':'📄 Download My Report'}
          </button>
        </div>
        <p style={{color:'var(--muted)',marginBottom:24,fontSize:13}}>
          Welcome, {user.name}
          {user.phone&&<span> • +91 {user.phone} ✓</span>}
        </p>

        {/* Key Stats */}
        <div className="mini-stat-row">
          {[
            {label:'Total Bids',val:myBids.length,color:'var(--accent)'},
            {label:'Auctions Joined',val:uniqueAuctions,color:'var(--info)'},
            {label:'Currently Winning',val:winning,color:'var(--warn)'},
            {label:'Auctions Won',val:won,color:'var(--accent)'},
            {label:'Outbid',val:outbid,color:'var(--danger)'},
            {label:'Total Paid',val:'₹'+(totalPaid/1000).toFixed(1)+'k',color:'var(--accent)'},
          ].map(s=>(
            <div key={s.label} className="mini-stat">
              <div className="mini-stat-val" style={{color:s.color,fontSize:s.label==='Total Paid'?18:22}}>{s.val}</div>
              <div className="mini-stat-lbl">{s.label}</div>
            </div>
          ))}
        </div>

        <div className="tabs" style={{marginBottom:24}}>
          {[['analytics','📊 Analytics'],['bids','My Bids'],['payments','Payments']].map(([t,l])=>(
            <button key={t} className={`tab${tab===t?' active':''}`} onClick={()=>setTab(t)}>{l}</button>
          ))}
        </div>

        {tab==='analytics'&&(
          <div>
            <div className="chart-grid">
              {/* Bid History Chart */}
              <div className="analytics-section">
                <div className="chart-header">
                  <h4 style={{margin:0}}>My Bids (Last 7 Days)</h4>
                  <span style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk'}}>{myBids.length} total bids</span>
                </div>
                <UserBidHistoryChart userEmail={user.email} products={allProds}/>
              </div>

              {/* Auction Status Donut */}
              <div className="analytics-section">
                <div className="chart-header"><h4 style={{margin:0}}>My Bid Outcomes</h4></div>
                {myBids.length > 0 ? (
                  <div>
                    {[
                      {label:'Currently Winning',val:winning,color:'#10b981'},
                      {label:'Auctions Won',val:won,color:'#3b82f6'},
                      {label:'Outbid (Live)',val:outbid,color:'#f59e0b'},
                      {label:'Ended / Closed',val:myBids.filter(b=>b.status==='sold'&&!b.isHighest).length,color:'#6b7280'},
                    ].map(b=>(
                      <div key={b.label} className="pillar-bar-row">
                        <div className="pillar-bar-label">{b.label}</div>
                        <div className="pillar-bar-track">
                          <div className="pillar-bar-fill" style={{width:Math.round(b.val/Math.max(myBids.length,1)*100)+'%',background:b.color}}></div>
                        </div>
                        <div className="pillar-bar-pct" style={{color:b.color}}>{b.val}</div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div style={{textAlign:'center',padding:'40px 0',color:'var(--muted)',fontSize:13}}>
                    <div style={{fontSize:36,marginBottom:12}}>🔨</div>
                    <p>No bids yet — start bidding on live auctions!</p>
                  </div>
                )}
              </div>
            </div>

            {/* Top Items by Bid */}
            {topItems.length > 0 && (
              <div className="analytics-section">
                <div className="chart-header">
                  <h4 style={{margin:0}}>My Top Bids by Value</h4>
                </div>
                <div>
                  {topItems.map(([name,data],i)=>(
                    <div key={i} className="pillar-bar-row">
                      <div className="pillar-bar-label" style={{width:220,fontSize:11}}>{name.length>28?name.substring(0,28)+'…':name}</div>
                      <div className="pillar-bar-track">
                        <div className="pillar-bar-fill" style={{width:Math.round(data.highest/topItems[0][1].highest*100)+'%',background:data.isHighest?'#10b981':'#3b82f6'}}></div>
                      </div>
                      <div style={{fontFamily:'Space Grotesk',fontSize:11,fontWeight:700,color:data.isHighest?'var(--accent)':'var(--info)',width:80,textAlign:'right',flexShrink:0}}>
                        ₹{(data.highest/1000).toFixed(0)}k
                      </div>
                    </div>
                  ))}
                  <div className="legend-row" style={{marginTop:8}}>
                    <div className="legend-item"><div className="legend-dot" style={{background:'#10b981'}}></div>Highest Bidder</div>
                    <div className="legend-item"><div className="legend-dot" style={{background:'#3b82f6'}}></div>Outbid</div>
                  </div>
                </div>
              </div>
            )}

            {/* Insights */}
            <div className="chart-grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))'}}>
              {[
                {icon:'🏆',title:'Win Rate',desc:`${uniqueAuctions>0?Math.round(won/uniqueAuctions*100):0}% of joined auctions won`,color:'rgba(16,185,129,0.1)',border:'rgba(16,185,129,0.25)'},
                {icon:'💸',title:'Total Invested',desc:`₹${totalPaid.toLocaleString('en-IN')} paid across ${myPayments.length} purchases`,color:'rgba(59,130,246,0.1)',border:'rgba(59,130,246,0.25)'},
                {icon:'🎯',title:'Active Competitions',desc:`${winning} winning, ${outbid} outbid in live auctions`,color:'rgba(245,158,11,0.1)',border:'rgba(245,158,11,0.25)'},
                {icon:'📦',title:'Collection',desc:`${won} rare antiques won and ${myPayments.length} items purchased`,color:'rgba(167,139,250,0.1)',border:'rgba(167,139,250,0.25)'},
              ].map((ins,i)=>(
                <div key={i} className="insight-card" style={{border:`1px solid ${ins.border}`,background:'var(--surface2)'}}>
                  <div className="insight-icon" style={{background:ins.color}}>{ins.icon}</div>
                  <div><div className="insight-title">{ins.title}</div><div className="insight-desc">{ins.desc}</div></div>
                </div>
              ))}
            </div>

            {/* Recent Bid Activity */}
            <div className="analytics-section">
              <div className="chart-header">
                <h4 style={{margin:0}}>My Recent Bids</h4>
                <button className="btn btn-primary btn-sm" style={{boxShadow:'0 0 10px rgba(16,185,129,0.3)'}} onClick={()=>onNav('home')}>Browse Auctions →</button>
              </div>
              <div className="activity-feed">
                {myBids.length===0?(
                  <div style={{textAlign:'center',padding:'24px 0',color:'var(--muted)',fontSize:13}}>
                    No bids placed yet. <span style={{color:'var(--accent)',cursor:'pointer'}} onClick={()=>onNav('home')}>Browse live auctions →</span>
                  </div>
                ):myBids.slice(0,8).map((b,i)=>(
                  <div key={i} className="activity-item">
                    <div className="activity-dot" style={{background:b.isHighest&&b.status==='live'?'var(--accent)':b.isHighest&&b.status==='sold'?'var(--info)':!b.isHighest&&b.status==='live'?'var(--warn)':'#6b7280'}}></div>
                    <div>
                      <div className="activity-text">
                        <strong style={{color:'var(--accent)'}}>₹{b.amount.toLocaleString('en-IN')}</strong> on <strong>{b.product}</strong>
                        {b.isHighest&&b.status==='live'&&<span style={{color:'var(--accent)',fontSize:10,marginLeft:6,fontFamily:'Space Grotesk',fontWeight:700}}>🏆 WINNING</span>}
                        {!b.isHighest&&b.status==='live'&&<span style={{color:'var(--warn)',fontSize:10,marginLeft:6,fontFamily:'Space Grotesk',fontWeight:700}}>⚡ OUTBID</span>}
                        {b.isHighest&&b.status==='sold'&&<span style={{color:'var(--info)',fontSize:10,marginLeft:6,fontFamily:'Space Grotesk',fontWeight:700}}>✅ WON</span>}
                      </div>
                      <div className="activity-time">{new Date(b.time).toLocaleString('en-IN')}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {tab==='bids'&&(
          <div>
            <button className="btn btn-primary" style={{marginBottom:20,boxShadow:'0 0 12px rgba(16,185,129,0.3)'}} onClick={()=>onNav('home')}>
              Browse Live Auctions →
            </button>
            {myBids.length===0?(
              <div style={{textAlign:'center',padding:'60px 0',color:'var(--muted)',background:'var(--surface)',borderRadius:16,border:'1px solid var(--border)'}}>
                <p style={{fontFamily:'Newsreader',fontSize:24,marginBottom:8}}>No bids placed yet</p>
                <p style={{fontSize:13}}>Start bidding on live auctions!</p>
              </div>
            ):(
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {myBids.map((b,i)=>{
                  const alreadyPaid=myPayments.some(p=>p.productId===b.productId);
                  const canPay=b.isHighest&&b.status==='live'&&!alreadyPaid;
                  return(
                    <div key={i} style={{background:'var(--surface)',border:`1px solid ${b.isHighest?'rgba(16,185,129,0.4)':'var(--border)'}`,borderRadius:12,padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
                      <div style={{flex:1,minWidth:180}}>
                        <div style={{fontWeight:600,marginBottom:2}}>{b.product}</div>
                        <div style={{fontSize:11,color:'var(--muted)'}}>{new Date(b.time).toLocaleString('en-IN')}</div>
                        {alreadyPaid&&<div style={{fontSize:11,color:'var(--accent)',marginTop:4}}>✅ Payment Complete</div>}
                      </div>
                      <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
                        <div style={{textAlign:'right'}}>
                          <div style={{fontFamily:'Space Grotesk',color:'var(--accent)',fontWeight:700,fontSize:15}}>₹{b.amount.toLocaleString('en-IN')}</div>
                          <div style={{fontSize:10,color:'var(--muted)'}}>Current: ₹{b.currentBid.toLocaleString('en-IN')}</div>
                        </div>
                        {b.isHighest&&b.status==='live'&&!alreadyPaid?
                          <span className="badge badge-live">🏆 Winning</span>:
                          !b.isHighest&&b.status==='live'?<span className="badge badge-rejected">Outbid</span>:
                          b.status==='sold'&&b.isHighest&&alreadyPaid?<span className="badge badge-sold">✅ Won & Paid</span>:
                          b.status==='sold'&&b.isHighest?<span className="badge badge-sold">Won</span>:
                          <span className="badge badge-pending">Ended</span>
                        }
                        {canPay&&(
                          <button className="btn btn-primary btn-sm" onClick={()=>handlePayNow(b)} style={{boxShadow:'0 0 8px rgba(16,185,129,0.4)'}}>
                            💳 Pay Now
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {tab==='payments'&&(
          <div>
            {myPayments.length===0?(
              <div style={{textAlign:'center',padding:'60px 0',color:'var(--muted)',background:'var(--surface)',borderRadius:16,border:'1px solid var(--border)'}}>
                <div style={{fontSize:48,marginBottom:16}}>💳</div>
                <p style={{fontFamily:'Newsreader',fontSize:24,marginBottom:8}}>No payments yet</p>
                <p style={{fontSize:13}}>Win an auction and complete payment to see your receipts here.</p>
              </div>
            ):(
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                {[...myPayments].reverse().map((p,i)=>(
                  <div key={i} style={{background:'var(--surface)',border:'1px solid rgba(16,185,129,0.25)',borderRadius:14,padding:'18px 22px'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12,marginBottom:14}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>{p.productTitle}</div>
                        <div style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk',display:'flex',gap:12,flexWrap:'wrap'}}>
                          <span>📦 {p.sellerName}</span>
                          <span>💳 {p.methodLabel}</span>
                          <span>🕒 {new Date(p.timestamp).toLocaleString('en-IN')}</span>
                        </div>
                        <div style={{fontSize:10,color:'var(--muted2)',fontFamily:'Space Grotesk',marginTop:4}}>
                          Order: {p.orderId} | Txn: {p.txnId}
                        </div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontFamily:'Space Grotesk',fontWeight:700,color:'var(--accent)',fontSize:20}}>₹{p.breakdown.total.toLocaleString('en-IN')}</div>
                        <span className="badge badge-live" style={{marginTop:6}}>✓ Paid</span>
                      </div>
                    </div>
                    <div style={{background:'var(--surface2)',borderRadius:10,padding:'12px 14px',marginBottom:12,display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:10}}>
                      {[
                        {l:'Winning Bid',v:'₹'+p.breakdown.bidAmount.toLocaleString('en-IN')},
                        {l:'Platform Fee',v:'₹'+p.breakdown.platformFee.toLocaleString('en-IN')},
                        {l:'Shipping',v:'₹'+p.breakdown.shippingCharge.toLocaleString('en-IN')},
                        {l:'GST (18%)',v:'₹'+p.breakdown.gst.toLocaleString('en-IN')},
                      ].map(r=>(<div key={r.l}><div style={{fontSize:9,color:'var(--muted2)',fontFamily:'Space Grotesk',textTransform:'uppercase',letterSpacing:'0.1em'}}>{r.l}</div><div style={{fontSize:12,fontWeight:600,marginTop:2}}>{r.v}</div></div>))}
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
                      <div style={{fontSize:12,color:'var(--muted)'}}>
                        📦 <strong style={{color:'var(--text)'}}>{p.address.name}</strong>, {p.address.city}, {p.address.state} - {p.address.pincode}
                        <span style={{marginLeft:12,fontSize:11}}>📅 Est. Delivery: {new Date(p.timestamp+7*86400000).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</span>
                      </div>
                      <button className="btn btn-secondary btn-sm" onClick={()=>{try{ReceiptPDF.generate(p);addToast('Receipt downloaded!','success');}catch(e){addToast('Error generating receipt','error');}}} style={{gap:6}}>
                        📄 Download Receipt
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {payProduct&&user&&(
        <PaymentGatewayModal
          product={payProduct}
          user={user}
          wonAmount={payAmount}
          onClose={()=>{setPayProduct(null);setPayAmount(0);loadData();}}
          onSuccess={(pd)=>{addToast(`Payment of ₹${pd.breakdown.total.toLocaleString('en-IN')} successful!`,'success');loadData();}}
          addToast={addToast}
        />
      )}
    </div>
  );
}

// ===================== MAIN APP =====================
function App(){
  const [page,setPage]=useState('home');
  const [user,setUser]=useState(null);
  const [toasts,setToasts]=useState([]);

  const addToast=(msg,type='info')=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000);
  };

  useEffect(()=>{
    DB.init();
    const s=DB.get('session');
    if(s){setUser(s);OnlineTracker.join(s);}
    initSquares();
  },[]);

  const handleLogin=(u)=>{
    setUser(u);
    DB.set('session',u);
    OnlineTracker.join(u);
    if(u.role==='admin') setPage('admin');
    else if(u.role==='seller') setPage('seller');
    else setPage('home');
  };

  const handleLogout=()=>{
    if(user) OnlineTracker.leave(user);
    setUser(null);
    DB.set('session',null);
    setPage('home');
    addToast('Logged out successfully','info');
  };

  const nav=(p)=>setPage(p);

  return(
    <>
      <ToastContainer toasts={toasts}/>
      <div className="morph-blob" style={{top:'10%',left:'5%'}}/>
      <div className="morph-blob" style={{bottom:'10%',right:'5%',animationDelay:'-4s',background:'rgba(6,182,212,0.03)'}}/>
      <Navbar user={user} onLogout={handleLogout} onNav={nav}/>
      {page==='home'&&<HomePage user={user} onNav={nav} addToast={addToast}/>}
      {page==='login'&&<LoginPage onNav={nav} onLogin={handleLogin} addToast={addToast}/>}
      {page==='signup'&&<SignupPage onNav={nav} onLogin={handleLogin} addToast={addToast}/>}
      {page==='admin'&&user?.role==='admin'&&<AdminPanel user={user} addToast={addToast}/>}
      {page==='seller'&&user?.role==='seller'&&<SellerPanel user={user} addToast={addToast}/>}
      {page==='user'&&user?.role==='user'&&<UserDashboard user={user} onNav={nav} addToast={addToast}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
